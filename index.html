<script>

/********************************************************************
 * CONNECTION
 *
 * Students must start from the authenticated Apps Script launcher.
 * The launcher opens this GitHub microphone page in a new tab and
 * securely relays requests to Apps Script using window.postMessage.
 ********************************************************************/


/********************************************************************
 * MUSICAL SETTINGS
 ********************************************************************/

const TEMPO = 108;

const SCALE_INTERVALS =
  [0,2,4,5,7,5,4,2,0];

const SCALE_SOLFEGE =
  ['Do','Re','Mi','Fa','Sol','Fa','Mi','Re','Do'];

const LEAP_INTERVALS =
  [0,4,7,4,0];

const LEAP_SOLFEGE =
  ['Do','Mi','Sol','Mi','Do'];


/*
 * HYBRID RECORDING LIMITS
 *
 * Students always control when a recording begins and may tap Stop as soon
 * as they finish, falter, or become uncomfortable. These task-specific
 * maximums are only a safety net if a student forgets to tap Stop.
 */
const RECORDING_LIMITS = {
  speech:10,
  happyBirthday:25,
  scaleEcho:10,
  sustainedLoo:7,
  leapEcho:8,
};

function recordingControls(message){
  return (
    '<div class="recording"><span class="dot"></span>' + message + '</div>' +
    '<div class="btnrow"><button class="primary bigbtn" onclick="stopManual()">Stop recording</button></div>' +
    '<p class="small muted">Tap Stop when you finish. If you forget, it will stop automatically.</p>'
  );
}


/*
 * These are STARTING PITCHES for movable-Do patterns.
 * Students never need to see these note names.
 */
const NOTE_TO_MIDI = {
  'G2':43,
  'A2':45,
  'Bb2':46,

  'C3':48,
  'D3':50,
  'Eb3':51,
  'F3':53,
  'G3':55,
  'A3':57,
  'Bb3':58,

  'C4':60,
  'D4':62,
  'Eb4':63,
  'F4':65,
  'G4':67,
  'A4':69,
  'Bb4':70,

  'C5':72,
  'D5':74,
  'Eb5':75,
  'F5':77
};


/********************************************************************
 * LANGUAGE SUPPORT
 *
 * The selected language translates the complete student-facing interface.
 * Musical tasks and saved assessment data remain identical in every language.
 ********************************************************************/

const LANGUAGE_LABELS = {
  en:'English',
  es:'Español',
  pt:'Português',
  ht:'Kreyòl ayisyen',
  ar:'العربية',
  vi:'Tiếng Việt',
  zh:'简体中文',
  az:'Azərbaycanca',
  uk:'Українська',
  it:'Italiano',
  gu:'ગુજરાતી',
  ko:'한국어',
  hi:'हिन्दी',
  sq:'Shqip',
  km:'ភាសាខ្មែរ',
  ne:'नेपाली'
};

const LANGUAGE_LOCALES = {
  en:'en-US', es:'es-US', pt:'pt-BR', ht:'ht-HT', ar:'ar',
  vi:'vi-VN', zh:'zh-CN', az:'az-AZ', uk:'uk-UA', it:'it-IT',
  gu:'gu-IN', ko:'ko-KR', hi:'hi-IN', sq:'sq-AL', km:'km-KH', ne:'ne-NP'
};

function initialLanguage(){
  const query = new URLSearchParams(window.location.search).get('lang');
  if (LANGUAGE_LABELS[query]) return query;
  try{
    const saved = localStorage.getItem('galvinVdLanguage');
    if (LANGUAGE_LABELS[saved]) return saved;
  } catch(e){}
  return 'en';
}

function changeLanguage(lang){
  if (!LANGUAGE_LABELS[lang]) lang = 'en';
  state.lang = lang;
  try{ localStorage.setItem('galvinVdLanguage', lang); } catch(e){}
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  const select = document.getElementById('globalLanguage');
  if (select) select.value = lang;

  if (state._pendingReview){
    renderPendingReview();
  } else if (typeof state.currentScreen === 'function'){
    state.currentScreen();
  }

  if (lang === 'en'){
    document.querySelectorAll('[data-vd-english]').forEach(function(el){
      el.textContent = el.dataset.vdEnglish;
      el.dataset.vdLang = 'en';
    });
  } else {
    schedulePageTranslation();
  }
}

/* Old translated support cards are intentionally removed in vNext2.3.1.
   The selected language now translates the actual student interface. */
function languageHelp(){ return ''; }
function speakLanguageHelp(){ speakCurrentDirections(); }

function setCurrentScreen(fn){
  state.currentScreen = fn;
  const select = document.getElementById('globalLanguage');
  if (select) select.value = state.lang || 'en';
  setTimeout(schedulePageTranslation, 0);
}

let _translationTimer = null;
let _translationBusy = false;
let _translationQueued = false;

function translatableElements(){
  const selectors = [
    '#app h2', '#app h3', '#app p', '#app label', '#app button',
    '#app summary', '#app .stepTitle', '#app .status', '#app .cheer',
    '#app .term', '.languageBar label', '.languageBar button'
  ].join(',');

  return Array.from(document.querySelectorAll(selectors)).filter(function(el){
    if (el.closest('.contourWrap')) return false;
    if (el.tagName === 'BUTTON' && el.onclick && String(el.onclick).includes('speakCurrentDirections')) return true;
    return true;
  });
}

function schedulePageTranslation(){
  if (!state || !state.lang || state.lang === 'en') return;
  clearTimeout(_translationTimer);
  _translationTimer = setTimeout(translateCurrentScreen, 90);
}

async function translateCurrentScreen(){
  if (!state || state.lang === 'en') return;
  if (!window.opener || window.opener.closed) return;
  if (_translationBusy){
    _translationQueued = true;
    return;
  }

  _translationBusy = true;
  const langAtStart = state.lang;

  try{
    const elements = translatableElements().filter(function(el){
      return el.dataset.vdLang !== langAtStart && (el.innerText || el.textContent || '').trim();
    });

    for (let offset = 0; offset < elements.length; offset += 50){
      if (state.lang !== langAtStart) return;
      const batch = elements.slice(offset, offset + 50);
      const strings = batch.map(function(el){
        if (!el.dataset.vdEnglish) el.dataset.vdEnglish = (el.innerText || el.textContent || '').trim();
        return el.dataset.vdEnglish;
      });

      const protect = [
        state.firstName || '',
        state.lastName || '',
        state.enrollment && state.enrollment.studentName ? state.enrollment.studentName : ''
      ].filter(Boolean);

      const result = await api('translateBatch', {
        lang:langAtStart,
        strings:strings,
        protect:protect
      });

      const translated = result && result.translations ? result.translations : [];
      batch.forEach(function(el, i){
        if (state.lang !== langAtStart) return;
        el.dataset.vdLang = langAtStart;
        el.textContent = translated[i] || strings[i];
      });
    }
  } catch(err){
    console.warn('Translation unavailable:', err);
  } finally {
    _translationBusy = false;
    if (_translationQueued){
      _translationQueued = false;
      schedulePageTranslation();
    }
  }
}

function speakCurrentDirections(){
  if (!('speechSynthesis' in window)) return;
  const root = document.getElementById('app');
  if (!root) return;
  const text = (root.innerText || '').replace(/\s+/g,' ').trim();
  if (!text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANGUAGE_LOCALES[state.lang] || 'en-US';
  window.speechSynthesis.speak(u);
}

function startTranslationObserver(){
  const root = document.getElementById('app');
  if (!root || typeof MutationObserver === 'undefined') return;
  const observer = new MutationObserver(function(){ schedulePageTranslation(); });
  observer.observe(root, {childList:true, subtree:true});
}

/********************************************************************
 * STATE
 ********************************************************************/

const CLIENT_VERSION = '2026-09-22 vNext2.10';

function getClientStartToken(){
  const key='galvin-vd-client-start-token';
  try{
    let token=sessionStorage.getItem(key);
    if (!token){
      token=(window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : ('vd_' + Date.now() + '_' + Math.random().toString(36).slice(2));
      sessionStorage.setItem(key,token);
    }
    return token;
  } catch(e){
    return 'vd_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  }
}

let state = {
  lang:initialLanguage(),
  currentScreen:null,
  currentStage:'welcome',
  clientStartToken:getClientStartToken(),
  studentId:'',
  lastName:'',
  enrollment:null,
  submissionCode:'',
  firstName:'',

  stream:null,
  audioCtx:null,
  analyser:null,
  meterRAF:null,

  patternHistory:[],
  samplesSaved:0,
  noComfortablePattern:false,

  recordingRetries:{},
  octaveEvidence:[],
  routeOctaveShift:0,
  _pendingReview:null
};

let pending = {};
let reqSeq = 0;

const TOTAL_STEPS = 8;


/********************************************************************
 * GENERAL HELPERS
 ********************************************************************/

function app(){
  return document.getElementById('app');
}


function esc(s){
  return String(s || '')
    .replace(
      /[&<>'"]/g,
      function(c){
        return {
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          "'":'&#39;',
          '"':'&quot;'
        }[c];
      }
    );
}


function setProgress(n){
  document.getElementById('progressBar')
    .style.width =
    Math.max(
      5,
      Math.round(n / TOTAL_STEPS * 100)
    ) + '%';
}


function sleep(ms){
  return new Promise(
    function(resolve){
      setTimeout(resolve, ms);
    }
  );
}


function disableButtons(){
  document.querySelectorAll('button')
    .forEach(
      function(button){
        button.disabled = true;
      }
    );
}


/********************************************************************
 * STABILITY / NON-PII DIAGNOSTICS
 ********************************************************************/

function coarseBrowser(){
  const ua=navigator.userAgent || '';
  if (/Edg\//.test(ua)) return 'Edge';
  if (/CriOS\//.test(ua)) return 'Chrome iOS';
  if (/FxiOS\//.test(ua)) return 'Firefox iOS';
  if (/Chrome\//.test(ua) && !/Edg\//.test(ua)) return 'Chrome';
  if (/Firefox\//.test(ua)) return 'Firefox';
  if (/Safari\//.test(ua) && !/Chrome\//.test(ua) && !/CriOS\//.test(ua)) return 'Safari';
  return 'Other';
}

function coarseOS(){
  const ua=navigator.userAgent || '';
  if (/CrOS/.test(ua)) return 'ChromeOS';
  if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1)) return 'iOS/iPadOS';
  if (/Android/.test(ua)) return 'Android';
  if (/Windows/.test(ua)) return 'Windows';
  if (/Macintosh|Mac OS X/.test(ua)) return 'macOS';
  if (/Linux/.test(ua)) return 'Linux';
  return 'Other';
}

function diagnosticPayload(category, message, extra){
  return {
    clientVersion:CLIENT_VERSION,
    submissionCode:state.submissionCode || '',
    stage:state.currentStage || '',
    category:category || 'client',
    browser:coarseBrowser(),
    os:coarseOS(),
    viewport:String(window.innerWidth || 0) + 'x' + String(window.innerHeight || 0),
    language:state.lang || 'en',
    secureContext:!!window.isSecureContext,
    mediaDevices:!!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
    mediaRecorder:!!window.MediaRecorder,
    audioContext:!!(window.AudioContext || window.webkitAudioContext),
    message:String(message || '').slice(0,300),
    extra:extra || {}
  };
}

function logDiagnostic(category, message, extra){
  if (!window.opener || window.opener.closed) return;
  try{
    api('diagnostic', diagnosticPayload(category,message,extra)).catch(function(){});
  } catch(e){}
}

function friendlyMediaError(err){
  const name=(err && err.name) ? err.name : '';
  if (name==='NotAllowedError' || name==='SecurityError'){
    return 'Microphone permission was blocked. Allow microphone access for this page, then reload and try again.';
  }
  if (name==='NotFoundError' || name==='DevicesNotFoundError'){
    return 'No microphone was found. Check the device microphone or use another device.';
  }
  if (name==='NotReadableError' || name==='TrackStartError'){
    return 'The microphone is busy or unavailable. Close other apps or tabs using the microphone, then try again.';
  }
  if (name==='AbortError'){
    return 'The microphone did not start correctly. Reload the page and try again.';
  }
  return 'The microphone could not start on this device. Reload and try again, or complete Voice Discovery with Mr. Zini at school.';
}

function technicalHelpHtml(){

/********************************************************************
 * APPS SCRIPT BACKEND BRIDGE
 ********************************************************************/

window.addEventListener(
  'message',
  function(event){

    const message = event.data;

    if (event.source !== window.opener){
      return;
    }

    if (
      !message ||
      message.source !== 'galvin-vd-backend' ||
      !message.reqId
    ){
      return;
    }

    const slot =
      pending[message.reqId];

    if (!slot){
      return;
    }

    delete pending[message.reqId];

    if (
      message.response &&
      message.response.ok
    ){
      slot.resolve(
        message.response.data
      );
    } else {
      slot.reject(
        new Error(
          message.response &&
          message.response.error
            ? message.response.error
            : 'Backend error.'
        )
      );
    }
  }
);


function api(action, payload){

  payload = payload || {};

  if (!window.opener || window.opener.closed){
    return Promise.reject(
      new Error(
        'Please start Voice Discovery from the school Voice Discovery link in Google Classroom.'
      )
    );
  }

  return new Promise(
    function(resolve, reject){

      const reqId =
        'r' +
        Date.now() +
        '_' +
        (++reqSeq);

      pending[reqId] = {
        resolve:resolve,
        reject:reject
      };

      window.opener.postMessage(
        {
          source:'galvin-vd-student',
          reqId:reqId,
          request:Object.assign(
            {action:action},
            payload
          )
        },
        '*'
      );

      setTimeout(
        function(){
          if (pending[reqId]){
            delete pending[reqId];
            reject(
              new Error(
                'The school connection did not respond. Make sure the original Galvin Voice Discovery tab is still open.'
              )
            );
          }
        },
        60000
      );
    }
  );
}

async function enableMic(){

  state.currentStage='microphone_permission';
  const area =
    document.getElementById('micArea');


  try{

    state.stream =
      await navigator
        .mediaDevices
        .getUserMedia(
          {
            audio:{
              echoCancellation:true,
              noiseSuppression:false,
              autoGainControl:false
            }
          }
        );


    state.audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    // Chrome may create Web Audio in a suspended state after the
    // permission prompt. Try to activate it now; runMicTest() tries
    // again from its own button click before validating signal level.
    try{
      if (state.audioCtx.state === 'suspended'){
        await state.audioCtx.resume();
      }
    } catch(e){}


    const source =
      state.audioCtx
        .createMediaStreamSource(
          state.stream
        );


    state.analyser =
      state.audioCtx
        .createAnalyser();


    state.analyser.fftSize =
      512;


    source.connect(
      state.analyser
    );


    area.innerHTML = `

      <div class="status ok">

          Microphone allowed ✓
        </b>

    });

    area.innerHTML = `

      </div>

      ${technicalHelpHtml()}

    schedulePageTranslation();

function runMeter(){

  cancelAnimationFrame(
    state.meterRAF
  );


  const data =
    new Uint8Array(
      state.analyser.fftSize
    );


  function tick(){

    state.analyser
      .getByteTimeDomainData(
        data
      );


    let sum = 0;


    for (const value of data){

      const x =
        (value - 128) / 128;

      sum += x * x;
    }


    const rms =
      Math.sqrt(
        sum / data.length
      );


    const fill =
      document.getElementById(
        'meterFill'
      );


    if (fill){

      fill.style.width =
        Math.min(
          100,
          rms * 550
        ) + '%';
    }


    state.meterRAF =
      requestAnimationFrame(
        tick
      );
  }


  tick();
}

/********************************************************************
 * RECORDING ENGINE
 ********************************************************************/

function recorderMime(){

  const options = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4',
    'audio/ogg;codecs=opus'
  ];


  for (const type of options){

    if (
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported(type)
    ){
      return type;
    }
  }


  return '';
}


function currentLevel(){

  if (!state.analyser){
    return 0;
  }


  const data =
    new Uint8Array(
      state.analyser.fftSize
    );


  state.analyser
    .getByteTimeDomainData(
      data
    );


  let sum = 0;


  for (const value of data){

    const x =
      (value - 128) / 128;

    sum += x * x;
  }


  return Math.sqrt(
    sum / data.length
  );
}


async function captureAudio(
  seconds,
  manual
){

  if (!state.stream || !state.stream.active){
    const err=new Error('The microphone connection was lost. Return to Step 1 or reload Voice Discovery.');
    err.name='MicrophoneDisconnected';
    logDiagnostic('recording_error',err.message,{errorName:err.name});
    throw err;
  }

  const mime =
    recorderMime();


  const recorder =
    new MediaRecorder(
      state.stream,
      mime
        ? {mimeType:mime}
        : undefined
    );


  const chunks = [];

  let maxLevel = 0;

  let levelTimer = null;


  recorder.ondataavailable =
    function(event){

      if (
        event.data &&
        event.data.size
      ){
        chunks.push(
          event.data
        );
      }
    };


  const startMs =
    Date.now();


  const stopped =
    new Promise(
      function(resolve, reject){

        recorder.onerror =
          function(event){

            reject(
              event.error ||
              new Error(
                'Recording failed.'
              )
            );
          };


        recorder.onstop =
          function(){

            clearInterval(
              levelTimer
            );


            const blob =
              new Blob(
                chunks,
                {
                  type:
                    recorder.mimeType ||
                    mime ||
                    'audio/webm'
                }
              );


            clearTimeout(state._manualStopTimer);
            state._manualStopTimer = null;
            state._manualRecorder = null;

            resolve(
              {
                blob:blob,
                maxLevel:maxLevel,
                durationSec:
                  (Date.now() - startMs) /
                  1000
              }
            );
          };
      }
    );


  recorder.start(
    250
  );


  levelTimer =
    setInterval(
      function(){

        maxLevel =
          Math.max(
            maxLevel,
            currentLevel()
          );

      },
      75
    );


  if (manual){

    state._manualRecorder =
      recorder;

    if (seconds > 0){
      state._manualStopTimer = setTimeout(
        function(){
          if (recorder.state !== 'inactive'){
            recorder.stop();
          }
        },
        seconds * 1000
      );
    }

  } else {

    setTimeout(
      function(){

        if (
          recorder.state !==
          'inactive'
        ){
          recorder.stop();
        }

      },
      seconds * 1000
    );
  }


  return stopped;
}


function stopManual(){

  if (
    state._manualRecorder &&
    state._manualRecorder.state !==
    'inactive'
  ){
    state._manualRecorder.stop();
  }
}


async function blobToBase64(blob){

  const buffer =
    await blob.arrayBuffer();


  const bytes =
    new Uint8Array(
      buffer
    );


  let binary = '';

  const chunkSize =
    0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ){

    binary +=
      String
        .fromCharCode
        .apply(
          null,
          bytes.subarray(
            i,
            Math.min(
              i + chunkSize,
              bytes.length
            )
          )
        );
  }


  return btoa(binary);
}

/********************************************************************
 * CLIENT-SIDE ACOUSTIC ANALYSIS
 *
 * Purpose: help the assessment interpret monophonic singing more
 * intelligently without making any student-facing grade/judgment.
 * Low-confidence results are saved for teacher review instead of
 * being treated as certain.
 ********************************************************************/

const PITCH_ANALYZER_VERSION = 'ClientPitch_v1.0';

function medianNumber(values){
  if (!values || !values.length) return null;
  const a = values.filter(Number.isFinite).slice().sort(function(x,y){return x-y;});
  if (!a.length) return null;
  const m = Math.floor(a.length/2);
  return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
}

function percentileNumber(values, p){
  if (!values || !values.length) return null;
  const a = values.filter(Number.isFinite).slice().sort(function(x,y){return x-y;});
  if (!a.length) return null;
  const x = Math.max(0, Math.min(1, p)) * (a.length - 1);
  const lo = Math.floor(x), hi = Math.ceil(x);
  if (lo === hi) return a[lo];
  return a[lo] + (a[hi]-a[lo]) * (x-lo);
}

function hzToMidi(hz){
  return 69 + 12 * Math.log2(hz / 440);
}

function roundedPitchName(midi){
  return Number.isFinite(midi) ? nameForMidi(Math.round(midi)) : '';
}

function downsampleMono(audioBuffer, targetRate){
  const channels = audioBuffer.numberOfChannels;
  const length = audioBuffer.length;
  const sourceRate = audioBuffer.sampleRate;
  const mono = new Float32Array(length);

  for (let c=0;c<channels;c++){
    const data = audioBuffer.getChannelData(c);
    for (let i=0;i<length;i++) mono[i] += data[i] / channels;
  }

  if (sourceRate <= targetRate * 1.15){
    return {data:mono, sampleRate:sourceRate};
  }

  const factor = Math.max(1, Math.floor(sourceRate / targetRate));
  const outLength = Math.floor(mono.length / factor);
  const out = new Float32Array(outLength);
  for (let i=0;i<outLength;i++){
    let sum=0;
    const base=i*factor;
    for (let j=0;j<factor;j++) sum += mono[base+j];
    out[i]=sum/factor;
  }
  return {data:out, sampleRate:sourceRate/factor};
}

function frameRms(data, start, length){
  let sum=0;
  const end=Math.min(data.length,start+length);
  for(let i=start;i<end;i++) sum += data[i]*data[i];
  return Math.sqrt(sum/Math.max(1,end-start));
}

function yinPitchFrame(data, start, frameSize, sampleRate){
  const minHz=75;
  const maxHz=750;
  const minTau=Math.max(2,Math.floor(sampleRate/maxHz));
  const maxTau=Math.min(Math.floor(sampleRate/minHz),Math.floor(frameSize/2));
  const available=Math.min(frameSize,data.length-start);
  if (available < maxTau + 128) return null;

  const rms=frameRms(data,start,available);
  if (rms < 0.006) return null;

  const diff=new Float32Array(maxTau+1);
  for(let tau=minTau;tau<=maxTau;tau++){
    let sum=0;
    const n=available-tau;
    for(let i=0;i<n;i++){
      const d=data[start+i]-data[start+i+tau];
      sum += d*d;
    }
    diff[tau]=sum/Math.max(1,n);
  }

  const cmnd=new Float32Array(maxTau+1);
  cmnd[0]=1;
  let running=0;
  for(let tau=1;tau<=maxTau;tau++){
    running += diff[tau];
    cmnd[tau] = running > 0 ? diff[tau] * tau / running : 1;
  }

  let tau=-1;
  const threshold=0.18;
  for(let t=minTau;t<=maxTau;t++){
    if (cmnd[t] < threshold){
      while(t+1<=maxTau && cmnd[t+1] < cmnd[t]) t++;
      tau=t;
      break;
    }
  }

  if (tau < 0){
    let best=1;
    let bestTau=-1;
    for(let t=minTau;t<=maxTau;t++){
      if (cmnd[t] < best){best=cmnd[t];bestTau=t;}
    }
    if (bestTau < 0 || best > 0.34) return null;
    tau=bestTau;
  }

  let betterTau=tau;
  if (tau>minTau && tau<maxTau){
    const s0=cmnd[tau-1], s1=cmnd[tau], s2=cmnd[tau+1];
    const denom=(2*s1-s2-s0);
    if (Math.abs(denom)>1e-9){
      betterTau = tau + 0.5*(s2-s0)/denom;
    }
  }

  const hz=sampleRate/betterTau;
  if (!(hz>=minHz && hz<=maxHz)) return null;
  return {hz:hz, clarity:Math.max(0,Math.min(1,1-cmnd[tau])), rms:rms};
}

function medianSmoothFrames(frames){
  if (frames.length < 3) return frames.slice();
  return frames.map(function(frame,i){
    const vals=[];
    for(let j=Math.max(0,i-1);j<=Math.min(frames.length-1,i+1);j++) vals.push(frames[j].midi);
    return Object.assign({},frame,{midi:medianNumber(vals)});
  });
}

async function extractPitchFrames(blob){
  const ctx = state.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const arrayBuffer = await blob.arrayBuffer();
  const decoded = await ctx.decodeAudioData(arrayBuffer.slice(0));
  const ds=downsampleMono(decoded,12000);
  const data=ds.data;
  const sr=ds.sampleRate;
  const frameSize=768;
  const hop=512;
  const frames=[];

  for(let start=0; start+frameSize<data.length; start+=hop){
    const p=yinPitchFrame(data,start,frameSize,sr);
    if (!p) continue;
    const midi=hzToMidi(p.hz);
    if (midi < 38 || midi > 84) continue;
    frames.push({
      time:start/sr,
      midi:midi,
      clarity:p.clarity,
      rms:p.rms
    });
  }
  return medianSmoothFrames(frames);
}

function dtwSequence(observed, expected){
  const n=expected.length, m=observed.length;
  if (!n || !m) return null;
  const INF=1e12;
  const dp=Array.from({length:n},function(){return new Float64Array(m).fill(INF);});
  const back=Array.from({length:n},function(){return new Int8Array(m);});
  const cost=function(i,j){return Math.min(8,Math.abs(observed[j]-expected[i]));};

  dp[0][0]=cost(0,0);
  for(let j=1;j<m;j++){
    dp[0][j]=dp[0][j-1]+cost(0,j);
    back[0][j]=1; // stay on same expected note
  }
  for(let i=1;i<n;i++){
    dp[i][0]=dp[i-1][0]+2.75+cost(i,0);
    back[i][0]=2; // expected note advanced without new observation
  }

  for(let i=1;i<n;i++){
    for(let j=1;j<m;j++){
      const c=cost(i,j);
      const stay=dp[i][j-1]+c;
      const advance=dp[i-1][j-1]+c;
      const skip=dp[i-1][j]+2.75+c*0.35;
      if (advance<=stay && advance<=skip){dp[i][j]=advance;back[i][j]=0;}
      else if (stay<=skip){dp[i][j]=stay;back[i][j]=1;}
      else {dp[i][j]=skip;back[i][j]=2;}
    }
  }

  const groups=Array.from({length:n},function(){return [];});
  let i=n-1,j=m-1;
  while(i>=0 && j>=0){
    groups[i].push(observed[j]);
    if (i===0 && j===0) break;
    const b=back[i][j];
    if (b===0){i--;j--;}
    else if (b===1){j--;}
    else {i--;}
    if (i<0 || j<0) break;
  }
  groups.forEach(function(g){g.reverse();});
  const medians=groups.map(function(g){return medianNumber(g);});
  const errors=medians.map(function(x,k){return Number.isFinite(x)?Math.abs(x-expected[k]):null;});
  const validErrors=errors.filter(Number.isFinite);
  const meanError=validErrors.length?validErrors.reduce(function(a,b){return a+b;},0)/validErrors.length:99;
  const pitchMatch=validErrors.length?100*validErrors.filter(function(x){return x<=0.85;}).length/n:0;
  const coverage=100*validErrors.length/n;

  let contourGood=0, intervalGood=0, transitions=0;
  for(let k=1;k<n;k++){
    if (!Number.isFinite(medians[k-1]) || !Number.isFinite(medians[k])) continue;
    const obsInt=medians[k]-medians[k-1];
    const expInt=expected[k]-expected[k-1];
    const obsDir=Math.abs(obsInt)<0.7?0:(obsInt>0?1:-1);
    const expDir=Math.abs(expInt)<0.7?0:(expInt>0?1:-1);
    if (obsDir===expDir) contourGood++;
    if (Math.abs(obsInt-expInt)<=1.35) intervalGood++;
    transitions++;
  }
  return {
    medians:medians,
    meanError:meanError,
    pitchMatchPct:pitchMatch,
    coveragePct:coverage,
    contourMatchPct:transitions?100*contourGood/transitions:0,
    intervalMatchPct:transitions?100*intervalGood/transitions:0
  };
}

function sequenceAnalysisFromFrames(frames, expectedMidis){
  const obs=frames.map(function(f){return f.midi;});

  // First answer the specific octave question: target octave, one octave down,
  // or one octave up.
  const octaveCandidates=[-12,0,12].map(function(shift){
    const target=expectedMidis.map(function(x){return x+shift;});
    return {shift:shift,result:dtwSequence(obs,target)};
  });
  octaveCandidates.sort(function(a,b){return a.result.meanError-b.result.meanError;});
  const bestOctave=octaveCandidates[0];
  const zero=octaveCandidates.find(function(x){return x.shift===0;});
  let octaveShift=0;
  const octaveStructureOk = expectedMidis.length===1
    ? bestOctave.result.pitchMatchPct>=70
    : bestOctave.result.contourMatchPct>=60;
  if (
    bestOctave.shift!==0 &&
    bestOctave.result.pitchMatchPct>=60 &&
    octaveStructureOk &&
    bestOctave.result.meanError+0.75 < zero.result.meanError
  ) octaveShift=bestOctave.shift;
  const octaveAware=octaveShift===0?zero:bestOctave;

  // Separately find the best overall transposition. This lets melodic-memory
  // scoring recognize a correctly remembered contour even when a student
  // starts on a different pitch that is not exactly an octave away.
  const freeCandidates=[];
  for(let shift=-12;shift<=12;shift++){
    const target=expectedMidis.map(function(x){return x+shift;});
    freeCandidates.push({shift:shift,result:dtwSequence(obs,target)});
  }
  freeCandidates.sort(function(a,b){
    if (a.result.meanError!==b.result.meanError) return a.result.meanError-b.result.meanError;
    return Math.abs(a.shift)-Math.abs(b.shift);
  });
  const freeBest=freeCandidates[0];

  return {
    octaveShift:octaveShift,
    pitchMatchPct:octaveAware.result.pitchMatchPct,
    absolutePitchMatchPct:zero.result.pitchMatchPct,
    relativePitchMatchPct:freeBest.result.pitchMatchPct,
    contourMatchPct:freeBest.result.contourMatchPct,
    intervalMatchPct:freeBest.result.intervalMatchPct,
    coveragePct:freeBest.result.coveragePct,
    meanErrorSemitones:octaveAware.result.meanError,
    noteMedians:freeBest.result.medians,
    freeTranspositionSemitones:freeBest.shift
  };
}

async function analyzeRecording(review){
  const base={
    analyzerVersion:PITCH_ANALYZER_VERSION,
    expectedPitchCount:0,
    pitchMatchPct:'',
    contourMatchPct:'',
    tonalDriftCents:'',
    confidence:0,
    needsReview:false,
    reviewReason:'',
    detectedLow:'', detectedHigh:'', medianPitch:'',
    stabilityNotes:'', analysisNotes:'', referenceStart:''
  };

  try{
    const frames=await extractPitchFrames(review.recording.blob);
    const midis=frames.map(function(f){return f.midi;});
    const avgClarity=frames.length?frames.reduce(function(a,f){return a+f.clarity;},0)/frames.length:0;
    const voicedSpan=frames.length>1?frames[frames.length-1].time-frames[0].time:0;

    base.detectedLow=roundedPitchName(percentileNumber(midis,0.05));
    base.detectedHigh=roundedPitchName(percentileNumber(midis,0.95));
    base.medianPitch=roundedPitchName(medianNumber(midis));

    let confidence=Math.min(100, Math.round(
      35*Math.min(1,frames.length/25) +
      35*Math.min(1,avgClarity/0.72) +
      30*Math.min(1,voicedSpan/2.0)
    ));

    if (frames.length<8){
      base.confidence=Math.min(confidence,30);
      base.needsReview=true;
      base.reviewReason='Not enough clear pitched singing was detected.';
      base.stabilityNotes='Very little reliable voiced pitch was detected.';
      base.analysisNotes='Audio saved; acoustic result is low confidence and should not be used automatically.';
      return base;
    }

    const expected=(review.meta && review.meta.expectedMidi)
      ? String(review.meta.expectedMidi).split(',').map(Number).filter(Number.isFinite)
      : [];

    base.expectedPitchCount=expected.length;
    base.referenceStart=review.meta && review.meta.tonic ? review.meta.tonic : '';

    if (expected.length){
      const seq=sequenceAnalysisFromFrames(frames,expected);
      base.sequence=seq;
      base.pitchMatchPct=Math.round(seq.pitchMatchPct*10)/10;
      base.contourMatchPct=expected.length>1?Math.round(seq.contourMatchPct*10)/10:'';
      base.confidence=Math.max(0,Math.min(100,Math.round((confidence*0.65)+(seq.coveragePct*0.35))));
      const octaveText=seq.octaveShift===12?'one octave higher':(seq.octaveShift===-12?'one octave lower':'target octave');

      if (expected.length===1){
        const center=medianNumber(midis);
        const cents=midis.map(function(x){return (x-center)*100;});
        const meanCents=cents.reduce(function(a,b){return a+b;},0)/cents.length;
        const variance=cents.reduce(function(a,b){const d=b-meanCents;return a+d*d;},0)/cents.length;
        const sdCents=Math.sqrt(variance);
        const third=Math.max(1,Math.floor(midis.length/3));
        const early=medianNumber(midis.slice(0,third));
        const late=medianNumber(midis.slice(-third));
        const drift=Number.isFinite(early)&&Number.isFinite(late)?Math.round((late-early)*100):'';
        base.tonalDriftCents=drift;
        base.stabilityNotes='Detected in ' + octaveText + '; pitch stability about ' + Math.round(sdCents) + ' cents SD' + (drift!==''?'; drift '+(drift>=0?'+':'')+drift+' cents':'') + '.';
      } else {
        base.stabilityNotes='Detected in ' + octaveText + '; interval match ' + Math.round(seq.intervalMatchPct) + '%; coverage ' + Math.round(seq.coveragePct) + '%.';
      }

      base.analysisNotes='Absolute pitch match ' + Math.round(seq.absolutePitchMatchPct) + '%. Relative pitch match ' + Math.round(seq.relativePitchMatchPct) + '%. Free transposition estimate ' + (seq.freeTranspositionSemitones>=0?'+':'') + seq.freeTranspositionSemitones + ' semitones.';
      if (base.confidence<45){
        base.needsReview=true;
        base.reviewReason='Low-confidence pitch analysis.';
      }
      return base;
    }

    // Natural singing / no fixed reference: capture center and observed range only.
    base.confidence=confidence;
    base.stabilityNotes='Natural singing sample; no target pitch was imposed.';
    base.analysisNotes='Observed pitch center and range only. No automated tone-quality judgment is made.';
    if (confidence<40){
      base.needsReview=true;
      base.reviewReason='Low-confidence natural-singing pitch estimate.';
    }
    return base;
  } catch(err){
    base.needsReview=true;
    base.reviewReason='Client acoustic analysis was unavailable for this recording.';
    base.analysisNotes='Recording was saved normally; analysis can be reviewed later.';
    return base;
  }
}

function analysisPayloadForServer(review){
  const a=review.analysis || {};
  return {
    confidence:a.confidence,
    expectedPitchCount:a.expectedPitchCount,
    pitchMatchPct:a.pitchMatchPct,
    contourMatchPct:a.contourMatchPct,
    tonalDriftCents:a.tonalDriftCents,
    needsReview:a.needsReview,
    reviewReason:a.reviewReason,
    detectedLow:a.detectedLow,
    detectedHigh:a.detectedHigh,
    medianPitch:a.medianPitch,
    stabilityNotes:a.stabilityNotes,
    analysisNotes:a.analysisNotes,
    referenceStart:a.referenceStart
  };
}

function confidentOctaveShift(analysis){
  if (!analysis || !analysis.sequence) return 0;
  const s=analysis.sequence;
  const singlePitch=Number(analysis.expectedPitchCount||0)===1;
  if (
    analysis.confidence>=55 &&
    Math.abs(s.octaveShift)===12 &&
    (singlePitch ? s.pitchMatchPct>=70 : (s.contourMatchPct>=65 && s.intervalMatchPct>=55))
  ) return s.octaveShift;
  return 0;
}

function registerOctaveEvidence(analysis){
  const shift=confidentOctaveShift(analysis);
  if (!shift) return;
  state.octaveEvidence.push(shift);
  if (state.octaveEvidence.length>5) state.octaveEvidence.shift();
  const recent=state.octaveEvidence.filter(function(x){return x===shift;}).length;
  if (state.routeOctaveShift===0 && recent>=2){
    state.routeOctaveShift=shift;
  }
}

function reviewHint(review){
  const a=review.analysis;
  if (!a) return '';
  if (a.reviewReason && a.confidence<35){
    return '<div class="status warn">I may not have heard enough clear singing. You can try once more, or use this recording if it represents what happened.</div>';
  }
  const shift=confidentOctaveShift(a);
  if (shift){
    return '<div class="status ok">Nice — you followed the pattern in a different octave. If you want, hear it again and try starting in the same pitch area as the example.</div>';
  }
  return '';
}

 * Every saved sample uses manual Start/Stop and one optional re-record.

async function queueRecordingReview(config){
  state._pendingReview = config;
  const area=document.getElementById(config.areaId);
  if (area) area.innerHTML='<div class="status warn">Recording captured ✓ Checking it…</div>';
  schedulePageTranslation();

  if (['happy','pattern','sustain','leap'].includes(config.kind)){
    config.analysis = await analyzeRecording(config);
  }
  renderPendingReview();
}

function renderPendingReview(){
  const review = state._pendingReview;
  if (!review) return;
  const area = document.getElementById(review.areaId);
  if (!area) return;

  const usedRetries = state.recordingRetries[review.key] || 0;
  area.innerHTML = `
    <div class="status ok"><b>Recording captured ✓</b></div>
    ${reviewHint(review)}
    <p>You do not need to listen to it. Use this recording, or try it one more time if you want.</p>
    <div class="btnrow">
      <button class="primary bigbtn" onclick="usePendingRecording()">Use this recording</button>
      ${usedRetries < 1 ? '<button class="secondary bigbtn" onclick="retryPendingRecording()">Try again</button>' : ''}
    </div>
  `;
  schedulePageTranslation();
}

async function saveReviewAnalysis(review){
  if (!review.analysis) return;
  try{
    await api('analysis',{
      submissionCode:state.submissionCode,
      exerciseId:review.exerciseId,
      attempt:review.attempt || 1,
      analysis:analysisPayloadForServer(review)
    });
  } catch(err){
    console.warn('Analysis metadata could not be saved:',err);
  }
}

async function usePendingRecording(){
  const review = state._pendingReview;
  if (!review) return;
  disableButtons();
  const area = document.getElementById(review.areaId);
  if (area) area.innerHTML = '<div class="status warn">Saving securely…</div>';

  try{
    await uploadRecording(
      review.exerciseId,
      review.exerciseType,
      review.recording,
      review.meta || {},
      review.attempt || 1
    );

    await saveReviewAnalysis(review);
    if (review.analysis) registerOctaveEvidence(review.analysis);

    state._pendingReview = null;

    if (review.kind === 'speech'){
      area.innerHTML = '<div class="status ok">Got it! ✓ Nice job.</div><div class="btnrow"><button class="primary" onclick="showHappyBirthday()">Continue</button></div>';
    } else if (review.kind === 'happy'){
      area.innerHTML = '<div class="status ok">Got it! ✓ Nice work.</div><p class="muted">Now we’ll try a few short patterns.</p><div class="btnrow"><button class="primary" onclick="beginPatterns()">Continue</button></div>';
    } else if (review.kind === 'pattern'){
      // Keep the acoustic result with this controlled pattern so the routing
      // summary can distinguish range/comfort from octave matching.
      state._currentPattern.analysis = review.analysis || null;
      area.innerHTML = comfortButtons(review.exerciseId, review.attempt || 1);
    } else if (review.kind === 'sustain'){
      area.innerHTML = '<div class="status ok">Perfect — got it! ✓</div><div class="btnrow"><button class="primary" onclick="showLeap()">Continue</button></div>';
    } else if (review.kind === 'leap'){
      area.innerHTML = '<div class="status ok">Nice job! ✓</div><div class="btnrow"><button class="primary" onclick="showFinish()">Continue</button></div>';
    }

    schedulePageTranslation();
  } catch(err){
    logDiagnostic('save_recording_error', err && err.message ? err.message : 'Could not save recording', {
      errorName:err && err.name ? err.name : '',
      recordingKind:review.kind || ''
    });
    if (area) area.innerHTML = '<div class="status bad">' + esc(err.message) + '</div>' + technicalHelpHtml() + '<div class="btnrow"><button class="secondary" onclick="renderPendingReview()">Back</button></div>';
    schedulePageTranslation();
  }
}

async function retryPendingRecording(){
  const review = state._pendingReview;
  if (!review) return;
  const usedRetries = state.recordingRetries[review.key] || 0;
  if (usedRetries >= 1) return;

  // A discarded take is not saved, but a clear repeated octave choice can
  // still help the adaptive route recognize a consistent octave tendency.
  if (review.analysis) registerOctaveEvidence(review.analysis);

  state.recordingRetries[review.key] = usedRetries + 1;
  state._pendingReview = null;

  if (review.kind === 'speech'){
    await recordSpeech();
  } else if (review.kind === 'happy'){
    await recordHappy();
  } else if (review.kind === 'pattern'){
    await listenCurrent();
  } else if (review.kind === 'sustain'){
    await listenSustain();
  } else if (review.kind === 'leap'){
    await listenLeap();
  }
}

 ********************************************************************/

function midiToFreq(midi){

  return (
    440 *
    Math.pow(
      2,
      (midi - 69) / 12
    )
  );
}


function nameForMidi(midi){

  const names = [
    'C',
    'C#',
    'D',
    'Eb',
    'E',
    'F',
    'F#',
    'G',
    'Ab',
    'A',
    'Bb',
    'B'
  ];


  return (
    names[
      (midi % 12 + 12) % 12
    ] +
    (
      Math.floor(midi / 12) - 1
    )
  );
}


/*
 * Gentle synthesized reference tone.
 * No human model voice is used.
 */
function softTone(
  midi,
  start,
  duration
){

  const ctx =
    state.audioCtx;


  const master =
    ctx.createGain();


  master.gain
    .setValueAtTime(
      0.0001,
      start
    );


  master.gain
    .exponentialRampToValueAtTime(
      0.22,
      start + 0.025
    );


  master.gain
    .exponentialRampToValueAtTime(
      0.0001,
      start + duration
    );


  master.connect(
    ctx.destination
  );


  [
    [1,1.00],
    [2,0.18],
    [3,0.06]
  ].forEach(
    function(pair){

      const harmonic =
        pair[0];

      const level =
        pair[1];


      const osc =
        ctx.createOscillator();


      const gain =
        ctx.createGain();


      osc.type =
        'sine';


      osc.frequency
        .setValueAtTime(
          midiToFreq(midi) *
          harmonic,
          start
        );


      gain.gain.value =
        level;


      osc.connect(gain);

      gain.connect(master);


      osc.start(start);

      osc.stop(
        start +
        duration +
        0.03
      );
    }
  );
}


async function playGenerated(
  startMidi,
  intervals,
  solfege
){

  if (
    state.audioCtx.state ===
    'suspended'
  ){
    await state.audioCtx.resume();
  }


  drawContour(
    intervals,
    solfege,
    -1
  );


  const beat =
    60 / TEMPO;


  const ctx =
    state.audioCtx;


  const startTime =
    ctx.currentTime + 0.25;


  let cursor = 0;


  for (
    let i = 0;
    i < intervals.length;
    i++
  ){

    const finalNote =
      i === intervals.length - 1;


    const duration =
      (
        finalNote
          ? beat * 2
          : beat
      ) * 0.90;


    softTone(
      startMidi + intervals[i],
      startTime + cursor,
      duration
    );


    setTimeout(
      function(){

        drawContour(
          intervals,
          solfege,
          i
        );

      },
      (cursor + 0.15) * 1000
    );


    cursor +=
      finalNote
        ? beat * 2
        : beat;
  }


  await sleep(
    (cursor + 0.4) * 1000
  );


  drawContour(
    intervals,
    solfege,
    -1
  );
}


/********************************************************************
 * SOLFEGE CONTOUR
 *
 * Vertical spacing represents semitones:
 *
 * Do -> Re = 2 semitones
 * Re -> Mi = 2 semitones
 * Mi -> Fa = 1 semitone
 * Fa -> Sol = 2 semitones
 *
 * Therefore Mi -> Fa visibly has HALF the vertical spacing
 * of the surrounding whole steps.
 ********************************************************************/

function drawContour(
  intervals,
  solfege,
  active
){

  const holder =
    document.getElementById(
      'contour'
    );


  if (!holder){
    return;
  }


  const width = 760;
  const height = 235;

  const left = 50;
  const right = 50;

  const bottom = 195;

  /*
   * Compact vertical spacing still preserves the true semitone relationships.
   */
  const semitonePx = 17;


  const usableWidth =
    width -
    left -
    right;


  const xs =
    intervals.map(
      function(_, i){

        return (
          left +
          i *
          (
            usableWidth /
            (intervals.length - 1)
          )
        );
      }
    );


  const ys =
    intervals.map(
      function(interval){

        return (
          bottom -
          interval *
          semitonePx
        );
      }
    );


  const points =
    xs.map(
      function(x, i){

        return (
          x +
          ',' +
          ys[i]
        );
      }
    ).join(' ');


  let svg =

    '<svg ' +
    'viewBox="0 0 ' +
    width +
    ' ' +
    height +
    '" ' +
    'aria-label="Solfege pitch contour">' +

    '<polyline ' +
    'class="contourLine" ' +
    'points="' +
    points +
    '">' +
    '</polyline>';


  xs.forEach(
    function(x, i){

      svg +=

        '<circle ' +
        'class="noteCircle ' +
        (
          i === active
            ? 'active'
            : ''
        ) +
        '" ' +
        'cx="' +
        x +
        '" ' +
        'cy="' +
        ys[i] +
        '" ' +
        'r="21">' +
        '</circle>' +

        '<text ' +
        'class="solfegeText" ' +
        'x="' +
        x +
        '" ' +
        'y="' +
        ys[i] +
        '">' +
        solfege[i] +
        '</text>';
    }
  );


  svg +=
    '</svg>';


  holder.innerHTML =
    svg;
}


/********************************************************************
 * CONTROLLED 5-NOTE PATTERNS
 ********************************************************************/

const MAX_SCALE_PATTERNS = 8;

/*
 * Ordered pattern starting pitches used by the adaptive range search.
 * The assessment does NOT force every singer through this list. It stops
 * once it has a comfortable anchor plus useful lower/upper boundary evidence,
 * or when the safety cap is reached.
 */
const RANGE_STARTS = [
  'G2','A2','Bb2','D3','F3','G3','A3','Bb3',
  'C4','D4','F4','G4','A4','Bb4','C5','D5'
];

let route = {
  phase:'start',
  anchor:'',
  lowerBoundaryStart:'',
  upperBoundaryStart:'',
  summaryAdded:false,
  confirmationPending:false,
  contradictionReason:'',
  stopReason:'',
  needsTeacherReview:false
};


function beginPatterns(){

  setProgress(5);

  state.patternHistory = [];


  state.noComfortablePattern = false;
  state.octaveEvidence = [];
  state.routeOctaveShift = 0;

  route = {
    phase:'start',
    anchor:'',
    lowerBoundaryStart:'',
    upperBoundaryStart:'',
    summaryAdded:false,
    confirmationPending:false,
    contradictionReason:'',
    stopReason:'',
    needsTeacherReview:false
  };


  showPattern(
    'G3',
    'Listen and echo'
  );
}


function patternActualStartMidi(startName){
  return NOTE_TO_MIDI[startName] + (state.routeOctaveShift || 0);
}

function patternPlayable(startName){
  const midi=patternActualStartMidi(startName);
  return Number.isFinite(midi) && midi>=43 && (midi+7)<=79;
}

function scaleMeta(startName){

  const start = patternActualStartMidi(startName);

  const midis =
    SCALE_INTERVALS.map(
      function(interval){
        return start + interval;
      }
    );

  return {
    startName:startName,
    startMidi:start,
    expectedMidi:midis.join(','),
    expectedPitches:midis.map(nameForMidi).join(' '),
    solfege:SCALE_SOLFEGE.join('–'),
    tonic:nameForMidi(start),
    tempoBpm:TEMPO
  };
}


function step4DirectionText_(currentMidi){
  const prior = state.patternHistory
    .filter(function(item){ return Number.isFinite(Number(item.actualStartMidi)); })
    .slice(-1)[0];

  if (!prior) return 'We’ll start in a comfortable middle area.';

  const delta = Number(currentMidi) - Number(prior.actualStartMidi);
  if (delta > 0) return 'This pattern is a little higher than the last one.';
  if (delta < 0) return 'This pattern is a little lower than the last one.';
  return 'This pattern checks the same area again for confirmation.';
}

function scaleAnalysisReliable_(analysis){
  if (!analysis || !analysis.sequence) return false;
  const s = analysis.sequence;
  const confidence = Number(analysis.confidence || 0);
  const coverage = Number(s.coveragePct || 0);
  const relative = Number(s.relativePitchMatchPct || 0);
  const contour = Number(s.contourMatchPct || 0);
  const interval = Number(s.intervalMatchPct || 0);

  if (confidence < 45 || coverage < 55) return false;
  return relative >= 45 || (contour >= 60 && interval >= 45);
}

function consecutiveUnreliablePatternCount_(){
  let count = 0;
  for (let i = state.patternHistory.length - 1; i >= 0; i--){
    const item = state.patternHistory[i];
    if (item.exercise !== 'CONTROLLED_SCALE') continue;
    if (item.analysisReliable === false) count++;
    else break;
  }
  return count;
}

function comfortContradiction_(latest){
  if (!latest || !Number.isFinite(Number(latest.actualStartMidi))) return '';
  const midi = Number(latest.actualStartMidi);
  const tolerance = 1;
  const comfortable = isComfortableResponse_(latest.comfort);

  for (let i = 0; i < state.patternHistory.length - 1; i++){
    const prior = state.patternHistory[i];
    if (prior.exercise !== 'CONTROLLED_SCALE') continue;
    if (!Number.isFinite(Number(prior.actualStartMidi))) continue;
    const pm = Number(prior.actualStartMidi);

    if (latest.comfort === 'Too low' && isComfortableResponse_(prior.comfort) && pm <= midi - tolerance){
      return 'A lower pattern was comfortable, but a higher pattern was marked Too low.';
    }
    if (latest.comfort === 'Too high' && isComfortableResponse_(prior.comfort) && pm >= midi + tolerance){
      return 'A higher pattern was comfortable, but a lower pattern was marked Too high.';
    }
    if (comfortable && prior.comfort === 'Too low' && pm >= midi + tolerance){
      return 'A higher pattern was marked Too low, but a lower pattern was comfortable.';
    }
    if (comfortable && prior.comfort === 'Too high' && pm <= midi - tolerance){
      return 'A lower pattern was marked Too high, but a higher pattern was comfortable.';
    }
  }
  return '';
}

function showPattern(
  startName,
  label,
  attempt
){

  state.currentStage='step4_range_pattern';

  if (!patternPlayable(startName)){
    finishPatterns();
    return;
  }

  setCurrentScreen(function(){ showPattern(startName, label, attempt); });

  attempt =
    attempt || 1;


  const meta =
    scaleMeta(
      startName
    );

  // Safety watchdog: a NEW routed pattern should never replay an actual
  // starting pitch that was already completed. Retries (attempt 2) are allowed.
  if ((attempt || 1) === 1 && testedActualMidi_(meta.startMidi)){
    finishPatterns();
    return;
  }


  state._comfortLocked = false;

  state._currentPattern = {
    startName:startName,
    label:label,
    attempt:attempt,
    meta:meta,
    isConfirmation:!!route.confirmationPending
  };


  app().innerHTML = `

    <div class="card">

      <div class="stepTitle">
        Step 4 — Finding your comfortable range
      </div>

      <div class="step4Progress">
        <strong>Step 4 continues — Pattern ${Math.min(MAX_SCALE_PATTERNS, uniquePatternCount() + 1)} of up to ${MAX_SCALE_PATTERNS}</strong>
        <div class="small">${esc(step4DirectionText_(meta.startMidi))} ${state._currentPattern.isConfirmation ? 'This is one confirmation pattern, then Step 4 will stop.' : 'The pitch changes as we check your low and high range.'}</div>
        <div class="miniTrack"><div class="miniFill" style="width:${Math.round((Math.min(MAX_SCALE_PATTERNS, uniquePatternCount() + 1)/MAX_SCALE_PATTERNS)*100)}%"></div></div>
      </div>

      <h2>
        Listen twice. Then sing it back on “loo.”
      </h2>

      <p class="muted">
        If a pattern feels too high or too low, stop and tell us. Step 4 may finish early when we have enough information.
      </p>

      <div
        id="contour"
        class="contourWrap">
      </div>

      <div class="btnrow">

          class="primary bigbtn"

          ▶ Listen twice

        </button>

      </div>

      <div id="patternAction"></div>

    </div>
  `;


  drawContour(
    SCALE_INTERVALS,
    SCALE_SOLFEGE,
    -1

}

async function patternComfort(
  comfort,
  exerciseId,
  attempt
){

  if (state._comfortLocked){
    return;
  }

  state._comfortLocked = true;
  disableButtons();

  try{

    const result = await api(
      'comfort',
      {
        submissionCode:
          state.submissionCode,

        exerciseId:
          exerciseId,

        attempt:
          attempt,

        comfort:
          comfort
      }
    );

    if (result && result.duplicate && result.existingComfort){
      comfort = result.existingComfort;
    }

  } catch(err){
    state._comfortLocked = false;
    alert(err.message || 'Could not save that answer. Please try again.');
    return;
  }


  const start =
    state._currentPattern.startName;


  const currentMeta = state._currentPattern.meta;
  const currentAnalysis = state._currentPattern.analysis || null;

  state.patternHistory.push(
    {
      exercise:'CONTROLLED_SCALE',
      start:start,
      actualStart:nameForMidi(currentMeta.startMidi),
      actualStartMidi:currentMeta.startMidi,
      comfort:comfort,
      attempt:attempt,
      octaveShift:currentAnalysis && currentAnalysis.sequence ? currentAnalysis.sequence.octaveShift : 0,
      pitchMatchPct:currentAnalysis ? currentAnalysis.pitchMatchPct : '',
      contourMatchPct:currentAnalysis ? currentAnalysis.contourMatchPct : '',
      intervalMatchPct:currentAnalysis && currentAnalysis.sequence ? currentAnalysis.sequence.intervalMatchPct : '',
      coveragePct:currentAnalysis && currentAnalysis.sequence ? currentAnalysis.sequence.coveragePct : '',
      detectedLow:currentAnalysis ? currentAnalysis.detectedLow : '',
      detectedHigh:currentAnalysis ? currentAnalysis.detectedHigh : '',
      medianPitch:currentAnalysis ? currentAnalysis.medianPitch : '',
      analysisConfidence:currentAnalysis ? currentAnalysis.confidence : '',
      analysisReliable:scaleAnalysisReliable_(currentAnalysis)
    }
  );

  const latest = state.patternHistory[state.patternHistory.length - 1];
  const wasConfirmation = !!state._currentPattern.isConfirmation;

  if (wasConfirmation){
    route.confirmationPending = false;
    route.needsTeacherReview = true;
    finishPatterns('Comfort responses were inconsistent, so Step 4 stopped after one confirmation pattern.', true);
    return;
  }

  if (consecutiveUnreliablePatternCount_() >= 2){
    route.needsTeacherReview = true;
    finishPatterns('Two patterns in a row did not give clear enough pitch-matching evidence.', true);
    return;
  }

  const contradiction = comfortContradiction_(latest);
  if (contradiction && !route.confirmationPending){
    route.confirmationPending = true;
    route.needsTeacherReview = true;
    route.contradictionReason = contradiction;
  }

  nextPattern(
    start,
    comfort
  );
}


function tested(startName){

  return state.patternHistory
    .some(
      function(item){

        return (
          item.start ===
          startName
        );
      }
    );
}


/*
 * Range routing must de-duplicate the ACTUAL pitch that students hear,
 * not only the nominal pattern name. When octave-aware recentering changes
 * routeOctaveShift, a different nominal name can otherwise map back onto a
 * pitch the student already completed. That can feel like an endless loop.
 */
function testedActualMidi_(midi){
  const wanted = Number(midi);
  if (!Number.isFinite(wanted)) return false;
  return state.patternHistory.some(function(item){
    return Number.isFinite(Number(item.actualStartMidi)) &&
      Math.round(Number(item.actualStartMidi)) === Math.round(wanted);
  });
}


function uniquePatternCount(){
  const seen = {};

  state.patternHistory.forEach(function(item){
    if (Number.isFinite(Number(item.actualStartMidi))){
      seen[String(Math.round(Number(item.actualStartMidi)))] = true;
    } else if (item.start){
      seen['name:' + item.start] = true;
    }
  });

  return Object.keys(seen).length;
}


function comfortablePatternCount(){
  return state.patternHistory.filter(function(item){
    return item.comfort === 'Easy' || item.comfort === 'Okay';
  }).length;
}


function isComfortableResponse_(comfort){
  return comfort === 'Easy' || comfort === 'Okay';
}


function referenceActualMidi_(startName){
  const historic = historyActualStartFor_(startName);
  return historic === null ? patternActualStartMidi(startName) : historic;
}

function rangeCandidatesBelow_(startName){
  const startMidi = referenceActualMidi_(startName);
  return RANGE_STARTS
    .filter(function(name){
      const actual = patternActualStartMidi(name);
      return actual < startMidi && !testedActualMidi_(actual) && patternPlayable(name);
    })
    .sort(function(a,b){ return patternActualStartMidi(b) - patternActualStartMidi(a); });
}


function rangeCandidatesAbove_(startName){
  const startMidi = referenceActualMidi_(startName);
  return RANGE_STARTS
    .filter(function(name){
      const actual = patternActualStartMidi(name);
      return actual > startMidi && !testedActualMidi_(actual) && patternPlayable(name);
    })
    .sort(function(a,b){ return patternActualStartMidi(a) - patternActualStartMidi(b); });
}

/*
 * Probe several semitones away when possible instead of crawling through
 * adjacent pitch levels. This finds useful boundaries with fewer patterns.
 */
function chooseBoundaryProbe_(options, fromStart){
  if (!options.length) return '';
  const fromMidi = referenceActualMidi_(fromStart);
  let best = options[0];
  let bestScore = Infinity;
  options.forEach(function(name){
    const distance = Math.abs(patternActualStartMidi(name) - fromMidi);
    const score = Math.abs(distance - 4);
    if (score < bestScore){
      bestScore = score;
      best = name;
    }
  });
  return best;
}


function showNextLower_(fromStart){
  if (uniquePatternCount() >= MAX_SCALE_PATTERNS){
    finishPatterns('Maximum pattern limit reached.');
    return;
  }

  const options = rangeCandidatesBelow_(fromStart);
  if (!options.length){
    beginUpperBoundarySearch_();
    return;
  }

  route.phase = route.anchor ? 'seekLowerBoundary' : 'findAnchorLower';
  showPattern(chooseBoundaryProbe_(options, fromStart), 'Listen and echo');
}


function showNextUpper_(fromStart){
  if (uniquePatternCount() >= MAX_SCALE_PATTERNS){
    finishPatterns('Maximum pattern limit reached.');
    return;
  }

  const options = rangeCandidatesAbove_(fromStart);
  if (!options.length){
    finishPatterns();
    return;
  }

  route.phase = route.anchor ? 'seekUpperBoundary' : 'findAnchorUpper';
  showPattern(chooseBoundaryProbe_(options, fromStart), 'Listen and echo');
}


function setComfortableAnchor_(start){
  if (!route.anchor){
    route.anchor = start;
  }

  /*
   * If the opening search already crossed a boundary, keep that evidence.
   * Otherwise, deliberately seek the lower boundary first, then the upper.
   */
  if (!route.lowerBoundaryStart){
    const lower = rangeCandidatesBelow_(route.anchor);
    if (lower.length && uniquePatternCount() < MAX_SCALE_PATTERNS){
      route.phase = 'seekLowerBoundary';
      showPattern(lower[0], 'Listen and echo');
      return;
    }
  }

  beginUpperBoundarySearch_();
}


function beginUpperBoundarySearch_(){
  if (!route.anchor){
    finishPatterns();
    return;
  }

  if (route.upperBoundaryStart){
    finishPatterns();
    return;
  }

  const upper = rangeCandidatesAbove_(route.anchor);
  if (!upper.length || uniquePatternCount() >= MAX_SCALE_PATTERNS){
    finishPatterns();
    return;
  }

  route.phase = 'seekUpperBoundary';
  showPattern(upper[0], 'Listen and echo');
}


/********************************************************************
 * ADAPTIVE RANGE ROUTING — vNEXT2.9 INTELLIGENT STOP
 *
 * Purpose:
 * - Find a comfortable five-note anchor.
 * - Then seek BOTH the lower and upper usable boundaries when possible.
 * - Stop at the first clear Too low / Too high boundary in each direction.
 * - Do not force every singer through a fixed battery.
 * - Safety cap: 8 unique ACTUAL scale starting pitches.
 *
 * The later analysis layer can distinguish:
 * - observed acoustic low/high across valid recordings,
 * - comfortable five-note range from Easy/Okay patterns,
 * - approximate lower/upper comfort boundaries.
 ********************************************************************/
function nextPattern(start, comfort){
  if (uniquePatternCount() >= MAX_SCALE_PATTERNS){
    finishPatterns('Maximum pattern limit reached.');
    return;
  }

  /* Find the first comfortable anchor. */
  if (!route.anchor){
    if (isComfortableResponse_(comfort)){
      setComfortableAnchor_(start);
      return;
    }

    if (comfort === 'Too high'){
      route.upperBoundaryStart = start;
      showNextLower_(start);
      return;
    }

    if (comfort === 'Too low'){
      route.lowerBoundaryStart = start;
      showNextUpper_(start);
      return;
    }

    finishPatterns();
    return;
  }

  /* After an anchor exists, deliberately seek the lower boundary. */
  if (route.phase === 'seekLowerBoundary'){
    if (comfort === 'Too low'){
      route.lowerBoundaryStart = start;
      beginUpperBoundarySearch_();
      return;
    }

    if (isComfortableResponse_(comfort)){
      showNextLower_(start);
      return;
    }

    // An unexpected Too high while moving down is contradictory evidence.
    // Do not push farther down; preserve the data and move to the upper side.
    beginUpperBoundarySearch_();
    return;
  }

  /* If we were searching downward just to find an anchor. */
  if (route.phase === 'findAnchorLower'){
    if (isComfortableResponse_(comfort)){
      setComfortableAnchor_(start);
      return;
    }

    if (comfort === 'Too high'){
      route.upperBoundaryStart = start;
      showNextLower_(start);
      return;
    }

    if (comfort === 'Too low'){
      route.lowerBoundaryStart = start;
      finishPatterns('Lower comfort boundary found, but no comfortable anchor was confirmed.');
      return;
    }
  }

  /* If we were searching upward just to find an anchor. */
  if (route.phase === 'findAnchorUpper'){
    if (isComfortableResponse_(comfort)){
      setComfortableAnchor_(start);
      return;
    }

    if (comfort === 'Too low'){
      route.lowerBoundaryStart = start;
      showNextUpper_(start);
      return;
    }

    if (comfort === 'Too high'){
      route.upperBoundaryStart = start;
      finishPatterns('Upper comfort boundary found.');
      return;
    }
  }

  /* Seek the upper boundary after a comfortable anchor is known. */
  if (route.phase === 'seekUpperBoundary'){
    if (comfort === 'Too high'){
      route.upperBoundaryStart = start;
      finishPatterns('Upper comfort boundary found.');
      return;
    }

    // Easy/Okay continues upward. A surprising Too low also continues upward,
    // because the purpose of this phase is to find where the upper side stops.
    showNextUpper_(start);
    return;
  }

  finishPatterns('Range routing completed.');
}


function historyActualStartFor_(startName){
  for (let i = state.patternHistory.length - 1; i >= 0; i--){
    const item = state.patternHistory[i];
    if (item.start === startName && Number.isFinite(Number(item.actualStartMidi))){
      return Number(item.actualStartMidi);
    }
  }
  return null;
}


function addRangeRoutingSummary_(){
  if (route.summaryAdded) return;
  route.summaryAdded = true;

  const comfortable = state.patternHistory.filter(function(item){
    return (item.comfort === 'Easy' || item.comfort === 'Okay') &&
      Number.isFinite(Number(item.actualStartMidi));
  });

  const starts = comfortable.map(function(item){ return Number(item.actualStartMidi); });
  const comfortableLow = starts.length ? Math.min.apply(null, starts) : null;
  const comfortableHigh = starts.length ? Math.max.apply(null, starts.map(function(m){ return m + 7; })) : null;

  const lowBoundaryMidi = route.lowerBoundaryStart ? historyActualStartFor_(route.lowerBoundaryStart) : null;
  const highBoundaryMidi = route.upperBoundaryStart ? historyActualStartFor_(route.upperBoundaryStart) : null;

  state.patternHistory.push({
    exercise:'CONTROLLED_RANGE_ROUTING_SUMMARY',
    patternCount:uniquePatternCount(),
    comfortablePatternLow:comfortableLow === null ? '' : nameForMidi(comfortableLow),
    comfortablePatternHigh:comfortableHigh === null ? '' : nameForMidi(comfortableHigh),
    lowerBoundaryStart:route.lowerBoundaryStart || '',
    lowerBoundaryActual:lowBoundaryMidi === null ? '' : nameForMidi(lowBoundaryMidi),
    upperBoundaryStart:route.upperBoundaryStart || '',
    upperBoundaryActual:highBoundaryMidi === null ? '' : nameForMidi(highBoundaryMidi),
    anchorStart:route.anchor || '',
    stopReason:route.stopReason || (uniquePatternCount() >= MAX_SCALE_PATTERNS ? 'Maximum pattern limit reached.' : 'Range routing completed.'),
    needsTeacherReview:!!route.needsTeacherReview,
    reviewReason:route.contradictionReason || (route.needsTeacherReview ? (route.stopReason || 'Range evidence was unclear.') : ''),
    rangeConfidence:rangeConfidence_(),
    method:'Adaptive five-note boundary search with intelligent stop'
  });
}


function rangeConfidence_(){
  if (route.needsTeacherReview) return 'Low';
  if (route.lowerBoundaryStart && route.upperBoundaryStart && comfortablePatternCount() > 0) return 'High';
  if (comfortablePatternCount() > 0) return 'Moderate';
  return 'Low';
}

function finishPatterns(reason, needsReview){
  if (reason) route.stopReason = reason;
  if (needsReview) route.needsTeacherReview = true;

  addRangeRoutingSummary_();

  if (comfortablePatternCount() === 0){
    state.noComfortablePattern = true;
    state.patternHistory.push({
      exercise:'CONTROLLED_PATTERN_ROUTING',
      comfort:'No comfortable five-note window found',
      stopReason:route.stopReason || 'No comfortable five-note window found',
      needsTeacherReview:route.needsTeacherReview
    });
  }

  showStep4Complete_();
}

function showStep4Complete_(){

  state.currentStage='step4_complete';
  setCurrentScreen(showStep4Complete_);
  setProgress(6);

  const review = route.needsTeacherReview;
  const nextText = comfortablePatternCount() > 0
    ? 'Next, you’ll hold one comfortable pitch.'
    : 'You do not need to keep testing your range today.';

  app().innerHTML = `
    <div class="card">
      <div class="stepTitle">Step 4 — Complete</div>
      <h2>Step 4 complete ✓</h2>
      <div class="status ${review ? 'warn' : 'ok'}">
        ${review
          ? 'We have enough information for now. Mr. Zini may check a few notes with you in person later.'
          : 'Great — we have enough information from these range patterns.'}
      </div>
      <p>${esc(nextText)}</p>
      <div class="btnrow">
        <button class="primary bigbtn" onclick="continueAfterStep4_()">Continue</button>
      </div>
    </div>
  `;
  schedulePageTranslation();
}

function continueAfterStep4_(){
  if (comfortablePatternCount() > 0) showSustained();
  else showFinish();
}


function showNoComfortablePattern_(){

  state.currentStage='step4_no_comfortable_pattern';

  setCurrentScreen(showNoComfortablePattern_);
  setProgress(6);

  app().innerHTML = `
    <div class="card">
      <div class="stepTitle">Voice Discovery</div>
      <h2>That was helpful — thank you!</h2>

      ${languageHelp('noComfort')}
      <p>
        We have enough information from those patterns, so you do not need to push your voice any higher or lower.
      </p>
      <p class="cheer">
        Nice work. You’re almost done!
      </p>
      <div class="btnrow">
        <button class="primary bigbtn" onclick="showFinish()">Continue</button>
      </div>
    </div>
  `;
}


/********************************************************************
 * COMFORTABLE SUSTAINED "OO"
 ********************************************************************/

function comfortableActualMidis_(preferredComfort){
  return state.patternHistory
    .filter(function(item){
      if (!Number.isFinite(Number(item.actualStartMidi))) return false;
      if (preferredComfort) return item.comfort === preferredComfort;
      return item.comfort === 'Easy' || item.comfort === 'Okay';
    })
    .map(function(item){return Number(item.actualStartMidi);})
    .filter(function(value,index,array){return array.indexOf(value)===index;})
    .sort(function(a,b){return a-b;});
}

function bestComfortableStartName_(){
  const midi=bestComfortableStart();
  return Number.isFinite(midi)?nameForMidi(midi):'';
}

function bestComfortableStart(){
  let values=comfortableActualMidis_('Easy');
  if (!values.length) values=comfortableActualMidis_('Okay');
  if (!values.length) return null;
  return values[Math.floor((values.length-1)/2)];
}


function showSustained(){

  state.currentStage='step5_sustained_loo';

  setCurrentScreen(showSustained);

  setProgress(6);


  const comfortableTonic =
    bestComfortableStart();

  if (comfortableTonic === null){
    showNoComfortablePattern_();
    return;
  }


  /* Use a pitch from the middle of a successful five-note pattern. */
  state._sustainMidi =
    comfortableTonic + 4;


  app().innerHTML = `

    <div class="card">

      <div class="stepTitle">
        Step 5 — Sustained sound
      </div>

      <h2>
        Hold one comfortable pitch.
      </h2>

      <p>
        Listen, then hold <b>“loo”</b> on the pitch for about 4 seconds. Keep it easy and relaxed.
      </p>

      <div class="btnrow">

        <button
          class="primary bigbtn"
          onclick="listenSustain()">

          ▶ Hear my pitch

        </button>

      </div>

      <div id="sustainAction"></div>

    </div>
  `;
}


async function listenSustain(){

  await state.audioCtx.resume();


  const ctx =
    state.audioCtx;


  const now =
    ctx.currentTime + 0.15;


  softTone(
    state._sustainMidi,
    now,
    1.25
  );


  await sleep(
    1550
  );


  document
    .getElementById(
      'sustainAction'
    )
    .innerHTML = `

      <p>
        Your turn! Hold <b>“loo”</b> comfortably for about 4 seconds.
      </p>

      <div class="btnrow">

        <button
          class="good"
          onclick="recordSustain()">

          Start recording

        </button>

      </div>
    `;
}


async function recordSustain(){
  disableButtons();
  await countdown();
  const area = document.getElementById('sustainAction');
  area.innerHTML = recordingControls('Recording… hold “loo” comfortably.');
  schedulePageTranslation();

  try{
    const recording = await captureAudio(RECORDING_LIMITS.sustainedLoo, true);
    const pitchName = nameForMidi(state._sustainMidi);
    queueRecordingReview({
      kind:'sustain', key:'sustain', areaId:'sustainAction',
      exerciseId:'SUSTAIN_' + pitchName.replace('#','SHARP'),
      exerciseType:'sustained_loo', recording:recording, attempt:1,
      meta:{
        expectedPitches:pitchName,
        expectedMidi:String(state._sustainMidi),
        solfege:'Do', tonic:pitchName
      }
    });
  } catch(err){
    area.innerHTML = '<div class="status bad">' + esc(err.message) + '</div>';
    schedulePageTranslation();
  }
}


/********************************************************************
 * LEAP / INTERVAL CHECK
 ********************************************************************/

function showLeap(){

  state.currentStage='step6_leap';

  setCurrentScreen(showLeap);

  setProgress(7);


  state._leapTonic =
    bestComfortableStart();

  if (state._leapTonic === null){
    showFinish();
    return;
  }


  app().innerHTML = `

    <div class="card">

      <div class="stepTitle">
        Step 6 — One last pattern
      </div>

      <h2>
        One last pattern!
      </h2>

      <p>
        This one has bigger jumps. <b>Listen twice, then sing it back on “loo.”</b>
      </p>

      <div
        id="contour"
        class="contourWrap">
      </div>

      <div class="btnrow">

        <button
          class="primary bigbtn"
          onclick="listenLeap()">

          ▶ Listen twice

        </button>

      </div>

      <div id="leapAction"></div>

    </div>
  `;


  drawContour(
    LEAP_INTERVALS,
    LEAP_SOLFEGE,
    -1
  );
}


async function listenLeap(){

  disableButtons();

  await playGenerated(
    state._leapTonic,
    LEAP_INTERVALS,
    LEAP_SOLFEGE
  );

  await sleep(450);

  await playGenerated(
    state._leapTonic,
    LEAP_INTERVALS,
    LEAP_SOLFEGE
  );


  document
    .getElementById(
      'leapAction'
    )
    .innerHTML = `

      <div class="status ok">
        Your turn!
      </div>

      <p>
        Sing the pattern back on <b>“loo.”</b>
      </p>

      <div class="btnrow">

        <button
          class="good"
          onclick="recordLeap()">

          Start recording

        </button>

      </div>
    `;
}


async function recordLeap(){
  disableButtons();
  await countdown();
  const area = document.getElementById('leapAction');
  area.innerHTML = recordingControls('Recording… sing the pattern on “loo.”');
  schedulePageTranslation();

  try{
    const recording = await captureAudio(RECORDING_LIMITS.leapEcho, true);
    const midis = LEAP_INTERVALS.map(function(interval){ return state._leapTonic + interval; });
    const tonicName = nameForMidi(state._leapTonic);
    queueRecordingReview({
      kind:'leap', key:'leap', areaId:'leapAction',
      exerciseId:'LEAP_' + tonicName.replace('#','SHARP'),
      exerciseType:'leap_echo', recording:recording, attempt:1,
      meta:{
        expectedPitches:midis.map(nameForMidi).join(' '),
        expectedMidi:midis.join(','),
        solfege:LEAP_SOLFEGE.join('–'),
        tonic:tonicName, tempoBpm:TEMPO
      }
    });
  } catch(err){
    area.innerHTML = '<div class="status bad">' + esc(err.message) + '</div>';
    schedulePageTranslation();
  }
}



/********************************************************************
 * FINAL COMFORT + SUBMISSION
 ********************************************************************/

function showFinish(){

  state.currentStage='finish_question';

  setCurrentScreen(showFinish);

  setProgress(8);


  app().innerHTML = `

    <div class="card">

      <div class="stepTitle">
        Final step
      </div>

      <h2>
        You did it! One quick question:
      </h2>

      ${languageHelp('finish')}

      <p>
        How did Voice Discovery feel overall?
      </p>

      <div class="comforts">

        <button
          onclick="finalize('Comfortable')">
          Comfortable
        </button>

        <button
          onclick="finalize('Mostly comfortable')">
          Mostly comfortable
        </button>

        <button
          onclick="finalize('A little nervous, but okay')">
          A little nervous, but okay
        </button>

        <button
          onclick="finalize('Uncomfortable')">
          Uncomfortable
        </button>

      </div>

      <div id="finishMsg"></div>

    </div>
  `;
}


async function finalize(
  overallComfort
){

  state.currentStage='finalize';
  disableButtons();


  const msg =
    document.getElementById(
      'finishMsg'
    );


  msg.innerHTML =

    '<div class="status warn">' +

    'Finishing your Voice Discovery…' +

    '</div>';


  try{

    await api(
      'finalize',
      {
        submissionCode:
          state.submissionCode,

        overallComfort:
          overallComfort,

        patternSummary:
          state.patternHistory
      }
    );


    if (state.stream){

      state.stream
        .getTracks()
        .forEach(
          function(track){

            track.stop();
          }
        );
    }


    cancelAnimationFrame(
      state.meterRAF
    );


    app().innerHTML = `

      <div class="card">

        <h2>
          All done! 🎉
        </h2>

        <p class="cheer">
          Great job, ${esc(state.firstName || 'singer')}!
        </p>

        <p>
          Thanks for giving Voice Discovery a try.
        </p>

        <p>
          Mr. Zini will use your recordings to help choose the chorus part that best fits your voice.
        </p>

        <p class="muted">
          <b>Your Voice Discovery was submitted successfully.</b> Your voice was not graded or scored. You’re finished — nice work!
        </p>

      </div>
    `;

  } catch(err){

    logDiagnostic('finalize_error', err && err.message ? err.message : 'Could not finalize submission', {
      errorName:err && err.name ? err.name : ''
    });

    msg.innerHTML =
      '<div class="status bad">' +
      esc(err.message) +
      '</div>' +
      technicalHelpHtml();
    schedulePageTranslation();
  }
}

 ********************************************************************/

if (initialSelect) initialSelect.value = state.lang;
startTranslationObserver();
document.documentElement.lang = state.lang || 'en';
document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';

if (!window.opener || window.opener.closed){
  setCurrentScreen(function(){ window.location.reload(); });
  setProgress(1);
  app().innerHTML = `
    <div class="card">
      <h2>Open Voice Discovery from Google Classroom</h2>
      ${languageHelp('direct')}
      <p>
        Start with the Galvin Middle School Chorus Voice Discovery link from Google Classroom.
      </p>
      <p class="muted">
        Keep the first school tab open while you complete Voice Discovery.
      </p>
    </div>
  `;
} else {
  showWelcome();
  const startupIssues=[];
  if (!window.isSecureContext) startupIssues.push('secure connection');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) startupIssues.push('microphone access');
  if (!window.MediaRecorder) startupIssues.push('audio recording');
  if (!(window.AudioContext || window.webkitAudioContext)) startupIssues.push('audio playback/analysis');
  if (startupIssues.length){
    logDiagnostic('compatibility_warning','Missing browser capabilities: ' + startupIssues.join(', '),{});
  }
}
