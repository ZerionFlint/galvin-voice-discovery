<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galvin Middle School Chorus — Voice Discovery</title>

<style>
  :root{
    --ink:#18212f;
    --muted:#667085;
    --line:#d9e0e8;
    --card:#ffffff;
    --bg:#f4f7fb;
    --accent:#3456d1;
    --accent2:#eef2ff;
    --ok:#147a52;
    --okbg:#ecfdf3;
    --warn:#9a6700;
    --warnbg:#fff8db;
    --bad:#b42318;
    --badbg:#fff0ee;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }

  .wrap{
    max-width:820px;
    margin:0 auto;
    padding:20px 14px 60px;
  }

  .brand{
    font-weight:800;
    font-size:13px;
    letter-spacing:.08em;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:8px;
  }

  h1{
    font-size:30px;
    margin:0 0 8px;
  }

  h2{
    font-size:24px;
    margin:0 0 10px;
  }

  h3{
    font-size:19px;
    margin:0 0 8px;
  }

  p{line-height:1.5}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    margin-top:16px;
    box-shadow:0 2px 10px rgba(16,24,40,.04);
  }

  .soft{background:var(--accent2)}
  .muted{color:var(--muted)}
  .small{font-size:13px;color:var(--muted)}

  .progress{
    height:8px;
    background:#e7ebf1;
    border-radius:999px;
    overflow:hidden;
    margin:16px 0 22px;
  }

  .progress>div{
    height:100%;
    background:var(--accent);
    width:5%;
    transition:width .25s;
  }

  label{
    display:block;
    font-weight:700;
    margin:14px 0 6px;
  }

  input{
    width:100%;
    font-size:17px;
    padding:12px 13px;
    border:1px solid #aeb8c5;
    border-radius:10px;
    background:#fff;
  }

  .emailField{
    display:flex;
    align-items:stretch;
    width:100%;
  }

  .emailField input{
    min-width:0;
    border-radius:10px 0 0 10px;
  }

  .emailSuffix{
    display:flex;
    align-items:center;
    padding:0 12px;
    border:1px solid #aeb8c5;
    border-left:0;
    border-radius:0 10px 10px 0;
    background:#eef1f6;
    font-size:17px;
    white-space:nowrap;
  }

  button{
    font:inherit;
    font-weight:700;
    border:0;
    border-radius:11px;
    padding:13px 18px;
    cursor:pointer;
  }

  button.primary{
    background:var(--accent);
    color:#fff;
  }

  button.secondary{
    background:#e9edf3;
    color:var(--ink);
  }

  button.good{
    background:var(--ok);
    color:#fff;
  }

  button:disabled{
    opacity:.45;
    cursor:not-allowed;
  }

  .btnrow{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
  }

  .bigbtn{
    font-size:19px;
    padding:16px 22px;
  }

  .status{
    border-radius:11px;
    padding:12px 14px;
    margin-top:13px;
  }

  .status.ok{
    background:var(--okbg);
    color:var(--ok);
  }

  .status.warn{
    background:var(--warnbg);
    color:var(--warn);
  }

  .status.bad{
    background:var(--badbg);
    color:var(--bad);
  }

  .hidden{display:none!important}

  .meter{
    height:18px;
    background:#e5e9ef;
    border-radius:999px;
    overflow:hidden;
    margin:12px 0;
  }

  .meter>div{
    height:100%;
    width:0;
    background:var(--ok);
    transition:width .08s;
  }

  .countdown{
    font-size:52px;
    font-weight:800;
    text-align:center;
    padding:20px;
  }

  .recording{
    font-size:20px;
    font-weight:800;
    color:var(--bad);
    display:flex;
    gap:9px;
    align-items:center;
    flex-wrap:wrap;
  }

  .dot{
    width:13px;
    height:13px;
    border-radius:50%;
    background:var(--bad);
    animation:pulse 1s infinite;
  }

  @keyframes pulse{
    50%{opacity:.35}
  }

  .comforts{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:14px;
  }

  .comforts button{
    background:#eef1f6;
    color:var(--ink);
    padding:14px;
  }

  .comforts button.stop{
    background:#fff0ee;
    color:var(--bad);
  }

  .contourWrap{
    background:#fbfcfe;
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px;
    margin:15px 0;
  }

  svg{
    width:100%;
    height:auto;
    display:block;
  }

  .contourLine{
    fill:none;
    stroke:#aab4c2;
    stroke-width:3;
  }

  .noteCircle{
    fill:#fff;
    stroke:#8793a4;
    stroke-width:2;
  }

  .noteCircle.active{
    fill:#dbe5ff;
    stroke:var(--accent);
    stroke-width:4;
  }

  .solfegeText{
    font-size:17px;
    font-weight:800;
    text-anchor:middle;
    dominant-baseline:central;
    fill:var(--ink);
  }

  .termGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
  }

  .term{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    line-height:1.4;
  }

  .cheer{
    font-weight:800;
    color:var(--accent);
  }

  .stepTitle{
    font-weight:800;
    color:var(--accent);
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }

  .languageBar{
    display:flex;
    gap:9px;
    align-items:center;
    flex-wrap:wrap;
    margin:10px 0 4px;
  }

  .languageBar label{
    margin:0;
    font-size:13px;
  }

  .languageBar select{
    font:inherit;
    padding:8px 10px;
    border:1px solid #aeb8c5;
    border-radius:9px;
    background:#fff;
  }

  .langHelp{
    background:#f8fafc;
    border-left:4px solid var(--accent);
    border-radius:8px;
    padding:11px 13px;
    margin:14px 0;
    line-height:1.5;
  }

  .langHelp button{
    margin-top:8px;
    padding:8px 10px;
    font-size:13px;
  }

  details.vocab{
    margin-top:14px;
  }

  details.vocab summary{
    cursor:pointer;
    font-weight:800;
    color:var(--accent);
  }

  @media(max-width:560px){
    h1{font-size:26px}
    .comforts{grid-template-columns:1fr}
    .termGrid{grid-template-columns:1fr}
    .card{padding:17px}
  }
</style>
</head>

  <div class="brand">

  </div>

  <div class="languageBar">

      <option value="gu">ગુજરાતી</option>
      <option value="ko">한국어</option>

</div>



<script>

/********************************************************************
 * CONNECTION
 *
 * Students must start from the authenticated Apps Script launcher.
 * The launcher opens this GitHub microphone page in a new tab and
 * securely relays requests to Apps Script using window.postMessage.
 ********************************************************************/


/********************************************************************
 * MUSICAL SETTINGS
 ********************************************************************/

const TEMPO = 84;

const SCALE_INTERVALS =
  [0,2,4,5,7,5,4,2,0];

const SCALE_SOLFEGE =
  ['Do','Re','Mi','Fa','Sol','Fa','Mi','Re','Do'];

const LEAP_INTERVALS =
  [0,4,7,4,0];

const LEAP_SOLFEGE =
  ['Do','Mi','Sol','Mi','Do'];


/*
 * These are STARTING PITCHES for movable-Do patterns.
 * Students never need to see these note names.
 */
const NOTE_TO_MIDI = {
  'G2':43,
  'A2':45,
  'Bb2':46,

  'C3':48,
  'D3':50,
  'Eb3':51,
  'F3':53,
  'G3':55,
  'A3':57,
  'Bb3':58,

  'C4':60,
  'D4':62,
  'Eb4':63,
  'F4':65,
  'G4':67,
  'A4':69,
  'Bb4':70,

  'C5':72,
  'D5':74,
  'Eb5':75,
  'F5':77
};


/********************************************************************
 * LANGUAGE SUPPORT
 *
 * The selected language translates the complete student-facing interface.
 * Musical tasks and saved assessment data remain identical in every language.
 ********************************************************************/

const LANGUAGE_LABELS = {
  en:'English',
  es:'Español',
  pt:'Português',
  ht:'Kreyòl ayisyen',
  ar:'العربية',
  vi:'Tiếng Việt',
  zh:'简体中文',
  az:'Azərbaycanca',
  uk:'Українська',
  it:'Italiano',
  gu:'ગુજરાતી',
  ko:'한국어',
  hi:'हिन्दी',
  sq:'Shqip',
  km:'ភាសាខ្មែរ',
  ne:'नेपाली'
};

const LANGUAGE_LOCALES = {
  en:'en-US', es:'es-US', pt:'pt-BR', ht:'ht-HT', ar:'ar',
  vi:'vi-VN', zh:'zh-CN', az:'az-AZ', uk:'uk-UA', it:'it-IT',
  gu:'gu-IN', ko:'ko-KR', hi:'hi-IN', sq:'sq-AL', km:'km-KH', ne:'ne-NP'
};

function initialLanguage(){
  const query = new URLSearchParams(window.location.search).get('lang');
  if (LANGUAGE_LABELS[query]) return query;
  try{
    const saved = localStorage.getItem('galvinVdLanguage');
    if (LANGUAGE_LABELS[saved]) return saved;
  } catch(e){}
  return 'en';
}

function changeLanguage(lang){
  if (!LANGUAGE_LABELS[lang]) lang = 'en';
  state.lang = lang;
  try{ localStorage.setItem('galvinVdLanguage', lang); } catch(e){}
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  const select = document.getElementById('globalLanguage');
  if (select) select.value = lang;

  if (state._pendingReview){
    renderPendingReview();
  } else if (typeof state.currentScreen === 'function'){
    state.currentScreen();
  }

  if (lang === 'en'){
    document.querySelectorAll('[data-vd-english]').forEach(function(el){
      el.textContent = el.dataset.vdEnglish;
      el.dataset.vdLang = 'en';
    });
  } else {
    schedulePageTranslation();
  }
}

/* Old translated support cards are intentionally removed in vNext2.3.1.
   The selected language now translates the actual student interface. */
function languageHelp(){ return ''; }
function speakLanguageHelp(){ speakCurrentDirections(); }

function setCurrentScreen(fn){
  state.currentScreen = fn;
  const select = document.getElementById('globalLanguage');
  if (select) select.value = state.lang || 'en';
  setTimeout(schedulePageTranslation, 0);
}

let _translationTimer = null;
let _translationBusy = false;
let _translationQueued = false;

function translatableElements(){
  const selectors = [
    '#app h2', '#app h3', '#app p', '#app label', '#app button',
    '#app summary', '#app .stepTitle', '#app .status', '#app .cheer',
    '#app .term', '.languageBar label', '.languageBar button'
  ].join(',');

  return Array.from(document.querySelectorAll(selectors)).filter(function(el){
    if (el.closest('.contourWrap')) return false;
    if (el.tagName === 'BUTTON' && el.onclick && String(el.onclick).includes('speakCurrentDirections')) return true;
    return true;
  });
}

function schedulePageTranslation(){
  if (!state || !state.lang || state.lang === 'en') return;
  clearTimeout(_translationTimer);
  _translationTimer = setTimeout(translateCurrentScreen, 90);
}

async function translateCurrentScreen(){
  if (!state || state.lang === 'en') return;
  if (!window.opener || window.opener.closed) return;
  if (_translationBusy){
    _translationQueued = true;
    return;
  }

  _translationBusy = true;
  const langAtStart = state.lang;

  try{
    const elements = translatableElements().filter(function(el){
      return el.dataset.vdLang !== langAtStart && (el.innerText || el.textContent || '').trim();
    });

    for (let offset = 0; offset < elements.length; offset += 50){
      if (state.lang !== langAtStart) return;
      const batch = elements.slice(offset, offset + 50);
      const strings = batch.map(function(el){
        if (!el.dataset.vdEnglish) el.dataset.vdEnglish = (el.innerText || el.textContent || '').trim();
        return el.dataset.vdEnglish;
      });

      const protect = [
        state.firstName || '',
        state.lastName || '',
        state.enrollment && state.enrollment.studentName ? state.enrollment.studentName : ''
      ].filter(Boolean);

      const result = await api('translateBatch', {
        lang:langAtStart,
        strings:strings,
        protect:protect
      });

      const translated = result && result.translations ? result.translations : [];
      batch.forEach(function(el, i){
        if (state.lang !== langAtStart) return;
        el.dataset.vdLang = langAtStart;
        el.textContent = translated[i] || strings[i];
      });
    }
  } catch(err){
    console.warn('Translation unavailable:', err);
  } finally {
    _translationBusy = false;
    if (_translationQueued){
      _translationQueued = false;
      schedulePageTranslation();
    }
  }
}

function speakCurrentDirections(){
  if (!('speechSynthesis' in window)) return;
  const root = document.getElementById('app');
  if (!root) return;
  const text = (root.innerText || '').replace(/\s+/g,' ').trim();
  if (!text) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANGUAGE_LOCALES[state.lang] || 'en-US';
  window.speechSynthesis.speak(u);
}

function startTranslationObserver(){
  const root = document.getElementById('app');
  if (!root || typeof MutationObserver === 'undefined') return;
  const observer = new MutationObserver(function(){ schedulePageTranslation(); });
  observer.observe(root, {childList:true, subtree:true});
}

/********************************************************************
 * STATE
 ********************************************************************/

let state = {
  lang:initialLanguage(),
  currentScreen:null,
  studentId:'',
  lastName:'',
  enrollment:null,
  submissionCode:'',
  firstName:'',

  stream:null,
  audioCtx:null,
  analyser:null,
  meterRAF:null,

  patternHistory:[],
  samplesSaved:0,
  noComfortablePattern:false,

  recordingRetries:{},
  _pendingReview:null
};

let pending = {};
let reqSeq = 0;

const TOTAL_STEPS = 8;


/********************************************************************
 * GENERAL HELPERS
 ********************************************************************/

function app(){
  return document.getElementById('app');
}


function esc(s){
  return String(s || '')
    .replace(
      /[&<>'"]/g,
      function(c){
        return {
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          "'":'&#39;',
          '"':'&quot;'
        }[c];
      }
    );
}


function setProgress(n){
  document.getElementById('progressBar')
    .style.width =
    Math.max(
      5,
      Math.round(n / TOTAL_STEPS * 100)
    ) + '%';
}


function sleep(ms){
  return new Promise(
    function(resolve){
      setTimeout(resolve, ms);
    }
  );
}


function disableButtons(){
  document.querySelectorAll('button')
    .forEach(
      function(button){
        button.disabled = true;
      }
    );
}


/********************************************************************
 * APPS SCRIPT BACKEND BRIDGE
 ********************************************************************/

window.addEventListener(
  'message',
  function(event){

    const message = event.data;

    if (event.source !== window.opener){
      return;
    }

    if (
      !message ||
      message.source !== 'galvin-vd-backend' ||
      !message.reqId
    ){
      return;
    }

    const slot =
      pending[message.reqId];

    if (!slot){
      return;
    }

    delete pending[message.reqId];

    if (
      message.response &&
      message.response.ok
    ){
      slot.resolve(
        message.response.data
      );
    } else {
      slot.reject(
        new Error(
          message.response &&
          message.response.error
            ? message.response.error
            : 'Backend error.'
        )
      );
    }
  }
);


function api(action, payload){

  payload = payload || {};

  if (!window.opener || window.opener.closed){
    return Promise.reject(
      new Error(
        'Please start Voice Discovery from the school Voice Discovery link in Google Classroom.'
      )
    );
  }

  return new Promise(
    function(resolve, reject){

      const reqId =
        'r' +
        Date.now() +
        '_' +
        (++reqSeq);

      pending[reqId] = {
        resolve:resolve,
        reject:reject
      };

      window.opener.postMessage(
        {
          source:'galvin-vd-student',
          reqId:reqId,
          request:Object.assign(
            {action:action},
            payload
          )
        },
        '*'
      );

      setTimeout(
        function(){
          if (pending[reqId]){
            delete pending[reqId];
            reject(
              new Error(
                'The school connection did not respond. Make sure the original Galvin Voice Discovery tab is still open.'
              )
            );
          }
        },
        60000
      );
    }
  );
}


/********************************************************************
 * WELCOME / STUDENT IDENTITY
 ********************************************************************/

function showWelcome(){

  setCurrentScreen(showWelcome);
  setProgress(1);

  app().innerHTML = `

    <div class="card soft">

      <h2>
        Welcome to Voice Discovery!
      </h2>

      <p>
        This is <b>not an audition</b>.
        Completing Voice Discovery may count as a chorus assignment, but
        <b>your voice, range, tone, or singing ability is not graded</b>.
      </p>

      <p>
        Singing voices can change dramatically during grades 5–8.
        Range, tone, registers, and the notes that feel most comfortable can shift as you grow.

      </p>

      <p>

      </p>

      <p class="cheer">

      </p>

      ${languageHelp('welcome')}

      <details class="vocab">
        <summary>Voice words you’ll hear</summary>
        <div class="termGrid" aria-label="Voice words to know">
          <div class="term"><b>Pitch</b><br><span class="small">How high or low a note sounds.</span></div>
          <div class="term"><b>Range</b><br><span class="small">All the notes your voice can sing, from your lowest to your highest.</span></div>
          <div class="term"><b>Comfortable range</b><br><span class="small">Notes you can sing without pushing, straining, or feeling uncomfortable.</span></div>
          <div class="term"><b>Tessitura</b><br><span class="small">The part of your range where your voice feels best and can sing comfortably for longer.</span></div>
          <div class="term"><b>Tone</b><br><span class="small">The quality or “color” of your sound. Different tones are not better or worse.</span></div>
          <div class="term"><b>Register</b><br><span class="small">An area of your voice that may feel or sound different as you sing higher or lower.</span></div>
          <div class="term"><b>Voice part</b><br><span class="small">The musical line you sing in a particular song. Your part may change from song to song.</span></div>
        </div>
      </details>

      <p class="small" style="margin-top:14px;">
        Never push or strain your voice. If singing hurts, stop and tell Mr. Zini.
      </p>

    </div>


    <div class="card">

      ${languageHelp('login')}

      <label>
        School email
      </label>

      <div class="emailField">
        <input
          id="studentId"
          inputmode="numeric"
          autocomplete="off"
          placeholder="student number">
        <span class="emailSuffix">@wpsstudent.org</span>
      </div>

      <p class="small">
        Type only the numbers before @wpsstudent.org.
      </p>


      <label>
        Last name
      </label>

      <input
        id="lastName"
        autocomplete="family-name">


      <div class="btnrow">

        <button
          class="primary bigbtn"
          onclick="lookup()">

          Let’s begin

        </button>

      </div>

      <div id="startMsg"></div>

    </div>
  `;
}


async function lookup(){

  const studentId =
    document
      .getElementById('studentId')
      .value
      .trim();

  const lastName =
    document
      .getElementById('lastName')
      .value
      .trim();

  const msg =
    document.getElementById('startMsg');


  if (
    !studentId ||
    !lastName
  ){

    msg.innerHTML =
      '<div class="status warn">' +
      'Enter both fields.' +
      '</div>';

    return;
  }


  msg.innerHTML =
    '<div class="status warn">' +
    'Checking your chorus enrollment…' +
    '</div>';


  try{

    const res =
      await api(
        'lookup',
        {
          studentId:studentId,
          lastName:lastName
        }
      );


    state.studentId =
      studentId;

    state.lastName =
      lastName;


    showEnrollmentChoices(
      res.matches
    );

  } catch(err){

    msg.innerHTML =
      '<div class="status bad">' +
      esc(err.message) +
      '</div>';
  }
}


function showEnrollmentChoices(matches){

  setCurrentScreen(function(){ showEnrollmentChoices(matches); });

  const buttons =
    matches
      .map(
        function(match){

          const detail = match.label || ('Grade ' + match.grade);

          return `

            <button
              class="secondary"
              style="
                text-align:left;
                width:100%;
                margin:6px 0;
              "
              onclick='chooseEnrollment(${JSON.stringify(match)})'>

              <b style="font-size:18px;">
                Grade ${esc(match.grade)}

        );

      )();

function runMeter(){

  cancelAnimationFrame(
    state.meterRAF
  );


  const data =
    new Uint8Array(
      state.analyser.fftSize
    );


  function tick(){

    state.analyser
      .getByteTimeDomainData(
        data
      );


    let sum = 0;


    for (const value of data){

      const x =
        (value - 128) / 128;

      sum += x * x;
    }


    const rms =
      Math.sqrt(
        sum / data.length
      );


    const fill =
      document.getElementById(
        'meterFill'
      );


    if (fill){

      fill.style.width =
        Math.min(
          100,
          rms * 550
        ) + '%';
    }


    state.meterRAF =
      requestAnimationFrame(
        tick
      );
  }


  tick();
}


async function runMicTest(){

  const msg =
    document.getElementById(
      'testMsg'
    );

  // This button click is a fresh user gesture, so it is the most
  // reliable place to wake Chrome's Web Audio analyser.
  try{
    if (state.audioCtx && state.audioCtx.state === 'suspended'){
      await state.audioCtx.resume();
    }
  } catch(e){}


  msg.innerHTML =
    '<div class="status warn">' +
    'Say “hello” now…' +
    '</div>';


  try{

    const recording =
      await captureAudio(
        2.5,
        false
      );


    const analyserRunning =
      state.audioCtx &&
      state.audioCtx.state === 'running';

    const signalTooQuiet =
      analyserRunning &&
      recording.maxLevel < 0.0025;

    if (
      recording.blob.size < 800 ||
      signalTooQuiet
    ){

      msg.innerHTML =

        '<div class="status warn">' +

        'I did not hear much sound. ' +
        'Move a little closer and try once more.' +

        '</div>';

      return;
    }


    msg.innerHTML =

      '<div class="status ok">' +

      '<b>Microphone working ✓</b> ' +

      'Your test was captured. ' +
      'It was not saved and you do not need to hear it.' +

      '</div>' +

      '<div class="btnrow">' +

      '<button class="primary bigbtn" onclick="showSpeech()">' +

      'Start Voice Discovery' +

      '</button>' +

      '</div>';

  } catch(err){

    msg.innerHTML =
      '<div class="status bad">' +
      esc(err.message) +
      '</div>';
  }
}


/********************************************************************
 * RECORDING ENGINE
 ********************************************************************/

function recorderMime(){

  const options = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4',
    'audio/ogg;codecs=opus'
  ];


  for (const type of options){

    if (
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported(type)
    ){
      return type;
    }
  }


  return '';
}


function currentLevel(){

  if (!state.analyser){
    return 0;
  }


  const data =
    new Uint8Array(
      state.analyser.fftSize
    );


  state.analyser
    .getByteTimeDomainData(
      data
    );


  let sum = 0;


  for (const value of data){

    const x =
      (value - 128) / 128;

    sum += x * x;
  }


  return Math.sqrt(
    sum / data.length
  );
}


async function captureAudio(
  seconds,
  manual
){

  const mime =
    recorderMime();


  const recorder =
    new MediaRecorder(
      state.stream,
      mime
        ? {mimeType:mime}
        : undefined
    );


  const chunks = [];

  let maxLevel = 0;

  let levelTimer = null;


  recorder.ondataavailable =
    function(event){

      if (
        event.data &&
        event.data.size
      ){
        chunks.push(
          event.data
        );
      }
    };


  const startMs =
    Date.now();


  const stopped =
    new Promise(
      function(resolve, reject){

        recorder.onerror =
          function(event){

            reject(
              event.error ||
              new Error(
                'Recording failed.'
              )
            );
          };


        recorder.onstop =
          function(){

            clearInterval(
              levelTimer
            );


            const blob =
              new Blob(
                chunks,
                {
                  type:
                    recorder.mimeType ||
                    mime ||
                    'audio/webm'
                }
              );


            clearTimeout(state._manualStopTimer);
            state._manualStopTimer = null;
            state._manualRecorder = null;

            resolve(
              {
                blob:blob,
                maxLevel:maxLevel,
                durationSec:
                  (Date.now() - startMs) /
                  1000
              }
            );
          };
      }
    );


  recorder.start(
    250
  );


  levelTimer =
    setInterval(
      function(){

        maxLevel =
          Math.max(
            maxLevel,
            currentLevel()
          );

      },
      75
    );


  if (manual){

    state._manualRecorder =
      recorder;

    if (seconds > 0){
      state._manualStopTimer = setTimeout(
        function(){
          if (recorder.state !== 'inactive'){
            recorder.stop();
          }
        },
        seconds * 1000
      );
    }

  } else {

    setTimeout(
      function(){

        if (
          recorder.state !==
          'inactive'
        ){
          recorder.stop();
        }

      },
      seconds * 1000
    );
  }


  return stopped;
}


function stopManual(){

  if (
    state._manualRecorder &&
    state._manualRecorder.state !==
    'inactive'
  ){
    state._manualRecorder.stop();
  }
}


async function blobToBase64(blob){

  const buffer =
    await blob.arrayBuffer();


  const bytes =
    new Uint8Array(
      buffer
    );


  let binary = '';

  const chunkSize =
    0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ){

    binary +=
      String
        .fromCharCode
        .apply(
          null,
          bytes.subarray(
            i,
            Math.min(
              i + chunkSize,
              bytes.length
            )
          )
        );
  }


  return btoa(binary);
}

 * Every saved sample uses manual Start/Stop and one optional re-record.
 * Nothing is uploaded until the student chooses “Use this recording.”
 ********************************************************************/

function queueRecordingReview(config){
  state._pendingReview = config;
  renderPendingReview();
}

function renderPendingReview(){
  const review = state._pendingReview;
  if (!review) return;
  const area = document.getElementById(review.areaId);
  if (!area) return;

  const usedRetries = state.recordingRetries[review.key] || 0;
  area.innerHTML = `
    <div class="status ok"><b>Recording captured ✓</b></div>
    <p>You do not need to listen to it. Use this recording, or try it one more time if you want.</p>
    <div class="btnrow">
      <button class="primary bigbtn" onclick="usePendingRecording()">Use this recording</button>
      ${usedRetries < 1 ? '<button class="secondary bigbtn" onclick="retryPendingRecording()">Try again</button>' : ''}
    </div>
  `;
  schedulePageTranslation();
}

async function usePendingRecording(){
  const review = state._pendingReview;
  if (!review) return;
  disableButtons();
  const area = document.getElementById(review.areaId);
  if (area) area.innerHTML = '<div class="status warn">Saving securely…</div>';

  try{
    await uploadRecording(
      review.exerciseId,
      review.exerciseType,
      review.recording,
      review.meta || {},
      review.attempt || 1
    );

    state._pendingReview = null;

    if (review.kind === 'speech'){
      area.innerHTML = '<div class="status ok">Got it! ✓ Nice job.</div><div class="btnrow"><button class="primary" onclick="showHappyBirthday()">Continue</button></div>';
    } else if (review.kind === 'happy'){
      area.innerHTML = '<div class="status ok">Got it! ✓ Nice work.</div><p class="muted">Now we’ll try a few short patterns.</p><div class="btnrow"><button class="primary" onclick="beginPatterns()">Continue</button></div>';
    } else if (review.kind === 'pattern'){
      area.innerHTML = comfortButtons(review.exerciseId, review.attempt || 1);
    } else if (review.kind === 'sustain'){
      area.innerHTML = '<div class="status ok">Perfect — got it! ✓</div><div class="btnrow"><button class="primary" onclick="showLeap()">Continue</button></div>';
    } else if (review.kind === 'leap'){
      area.innerHTML = '<div class="status ok">Nice job! ✓ Singing part finished.</div><div class="btnrow"><button class="primary" onclick="showFinish()">Continue</button></div>';
    }

    schedulePageTranslation();
  } catch(err){
    if (area) area.innerHTML = '<div class="status bad">' + esc(err.message) + '</div><div class="btnrow"><button class="secondary" onclick="renderPendingReview()">Back</button></div>';
    schedulePageTranslation();
  }
}

async function retryPendingRecording(){
  const review = state._pendingReview;
  if (!review) return;
  const usedRetries = state.recordingRetries[review.key] || 0;
  if (usedRetries >= 1) return;

  state.recordingRetries[review.key] = usedRetries + 1;
  state._pendingReview = null;

  if (review.kind === 'speech'){
    await recordSpeech();
  } else if (review.kind === 'happy'){
    await recordHappy();
  } else if (review.kind === 'pattern'){
    await listenCurrent();
  } else if (review.kind === 'sustain'){
    await listenSustain();
  } else if (review.kind === 'leap'){
    await listenLeap();
  }
}

/********************************************************************
 * GENERATED REFERENCE SOUND
 ********************************************************************/

function midiToFreq(midi){

  return (
    440 *
    Math.pow(
      2,
      (midi - 69) / 12
    )
  );
}


function nameForMidi(midi){

  const names = [
    'C',
    'C#',
    'D',
    'Eb',
    'E',
    'F',
    'F#',
    'G',
    'Ab',
    'A',
    'Bb',
    'B'
  ];


  return (
    names[
      (midi % 12 + 12) % 12
    ] +
    (
      Math.floor(midi / 12) - 1
    )
  );
}


/*
 * Gentle synthesized reference tone.
 * No human model voice is used.
 */
function softTone(
  midi,
  start,
  duration
){

  const ctx =
    state.audioCtx;


  const master =
    ctx.createGain();


  master.gain
    .setValueAtTime(
      0.0001,
      start
    );


  master.gain
    .exponentialRampToValueAtTime(
      0.22,
      start + 0.025
    );


  master.gain
    .exponentialRampToValueAtTime(
      0.0001,
      start + duration
    );


  master.connect(
    ctx.destination
  );


  [
    [1,1.00],
    [2,0.18],
    [3,0.06]
  ].forEach(
    function(pair){

      const harmonic =
        pair[0];

      const level =
        pair[1];


      const osc =
        ctx.createOscillator();


      const gain =
        ctx.createGain();


      osc.type =
        'sine';


      osc.frequency
        .setValueAtTime(
          midiToFreq(midi) *
          harmonic,
          start
        );


      gain.gain.value =
        level;


      osc.connect(gain);

      gain.connect(master);


      osc.start(start);

      osc.stop(
        start +
        duration +
        0.03
      );
    }
  );
}


async function playGenerated(
  startMidi,
  intervals,
  solfege
){

  if (
    state.audioCtx.state ===
    'suspended'
  ){
    await state.audioCtx.resume();
  }


  drawContour(
    intervals,
    solfege,
    -1
  );


  const beat =
    60 / TEMPO;


  const ctx =
    state.audioCtx;


  const startTime =
    ctx.currentTime + 0.25;


  let cursor = 0;


  for (
    let i = 0;
    i < intervals.length;
    i++
  ){

    const finalNote =
      i === intervals.length - 1;


    const duration =
      (
        finalNote
          ? beat * 2
          : beat
      ) * 0.90;


    softTone(
      startMidi + intervals[i],
      startTime + cursor,
      duration
    );


    setTimeout(
      function(){

        drawContour(
          intervals,
          solfege,
          i
        );

      },
      (cursor + 0.15) * 1000
    );


    cursor +=
      finalNote
        ? beat * 2
        : beat;
  }


  await sleep(
    (cursor + 0.4) * 1000
  );


  drawContour(
    intervals,
    solfege,
    -1
  );
}


/********************************************************************
 * SOLFEGE CONTOUR
 *
 * Vertical spacing represents semitones:
 *
 * Do -> Re = 2 semitones
 * Re -> Mi = 2 semitones
 * Mi -> Fa = 1 semitone
 * Fa -> Sol = 2 semitones
 *
 * Therefore Mi -> Fa visibly has HALF the vertical spacing
 * of the surrounding whole steps.
 ********************************************************************/

function drawContour(
  intervals,
  solfege,
  active
){

  const holder =
    document.getElementById(
      'contour'
    );


  if (!holder){
    return;
  }


  const width = 760;
  const height = 330;

  const left = 50;
  const right = 50;

  const bottom = 275;

  /*
   * 25 px per semitone:
   * half step = 25 px
   * whole step = 50 px
   */
  const semitonePx = 25;


  const usableWidth =
    width -
    left -
    right;


  const xs =
    intervals.map(
      function(_, i){

        return (
          left +
          i *
          (
            usableWidth /
            (intervals.length - 1)
          )
        );
      }
    );


  const ys =
    intervals.map(
      function(interval){

        return (
          bottom -
          interval *
          semitonePx
        );
      }
    );


  const points =
    xs.map(
      function(x, i){

        return (
          x +
          ',' +
          ys[i]
        );
      }
    ).join(' ');


  let svg =

    '<svg ' +
    'viewBox="0 0 ' +
    width +
    ' ' +
    height +
    '" ' +
    'aria-label="Solfege pitch contour">' +

    '<polyline ' +
    'class="contourLine" ' +
    'points="' +
    points +
    '">' +
    '</polyline>';


  xs.forEach(
    function(x, i){

      svg +=

        '<circle ' +
        'class="noteCircle ' +
        (
          i === active
            ? 'active'
            : ''
        ) +
        '" ' +
        'cx="' +
        x +
        '" ' +
        'cy="' +
        ys[i] +
        '" ' +
        'r="25">' +
        '</circle>' +

        '<text ' +
        'class="solfegeText" ' +
        'x="' +
        x +
        '" ' +
        'y="' +

}

function tested(startName){

    .some(

/********************************************************************
 * ADAPTIVE ROUTING — vNEXT
 *
 * Goals:
 * - Start in a safer middle/lower neighborhood at G3 -> D4.
 * - Never let a difficult pattern end the assessment.
 * - Student reports Easy / Okay / Too high / Too low.
 * - Find at least one comfortable five-note window when possible.
 * - Stop after a useful neighborhood/boundary picture, max 7 patterns.
 ********************************************************************/

function uniquePatternCount(){
  const seen = {};

  state.patternHistory.forEach(function(item){
    if (item.start){
      seen[item.start] = true;
    }
  });

  return Object.keys(seen).length;
}


function comfortablePatternCount(){
  return state.patternHistory.filter(function(item){
    return item.comfort === 'Easy' || item.comfort === 'Okay';
  }).length;
}


function nextPattern(
  start,
  comfort
){

  if (comfort === 'Too high'){
    route.lastTooHighStart = start;
  }

  if (comfort === 'Too low'){
    route.lastTooLowStart = start;
  }

  if (uniquePatternCount() >= MAX_SCALE_PATTERNS){
    finishPatterns();
    return;
  }

  /* First probe: G3 -> D4 */
  if (route.phase === 'start' && start === 'G3'){

    if (comfort === 'Too high'){
      route.phase = 'seekLowerComfort';
      route.queue = ['F3','D3','Bb2','A2','G2'];
      advanceAdaptiveQueue();
      return;
    }

    if (comfort === 'Too low'){
      route.phase = 'seekUpperComfort';
      route.queue = ['A3','Bb3','C4','D4','F4','G4','A4','Bb4','C5','D5'];
      advanceAdaptiveQueue();
      return;
    }

    // G3 was comfortable: check a little lower before exploring upward.
    route.phase = 'lowerProbe';
    route.queue = ['F3','D3'];
    advanceAdaptiveQueue();
    return;
  }

  /* We started too high and are moving down until something works. */
  if (route.phase === 'seekLowerComfort'){

    if (comfort === 'Easy' || comfort === 'Okay'){
      const lower = nextLowerStart_(start);

      if (lower && !tested(lower) && uniquePatternCount() < MAX_SCALE_PATTERNS){
        route.phase = 'finalLowerProbe';
        showPattern(lower, 'Listen and echo');
      } else {
        finishPatterns();
      }
      return;
    }

    if (comfort === 'Too low'){
      const bridge = midpointProbe_(route.lastTooHighStart, start);

      if (bridge && !tested(bridge) && uniquePatternCount() < MAX_SCALE_PATTERNS){
        route.phase = 'bracketProbe';
        showPattern(bridge, 'Listen and echo');
      } else {
        finishPatterns();
      }
      return;
    }

    advanceAdaptiveQueue();
    return;
  }

  /* One lower check after a comfortable lower/changing-voice window. */
  if (route.phase === 'finalLowerProbe'){
    finishPatterns();
    return;
  }

  /* G3 worked; check F3/D3, then explore upward. */
  if (route.phase === 'lowerProbe'){

    if (comfort === 'Easy' || comfort === 'Okay'){
      if (route.queue.length && uniquePatternCount() < MAX_SCALE_PATTERNS){
        advanceAdaptiveQueue();
      } else {
        beginUpperExploration_();
      }
      return;
    }

    // Once the lower probe is too low (or unexpectedly too high),
    // the comfortable G3 evidence is enough to begin moving upward.
    beginUpperExploration_();
    return;
  }

  /* G3 was too low; move upward until the first comfortable window. */
  if (route.phase === 'seekUpperComfort'){

    if (comfort === 'Easy' || comfort === 'Okay'){
      beginUpperExploration_(start);
      return;
    }

    if (comfort === 'Too high'){
      const bridge = midpointProbe_(route.lastTooLowStart, start);

      if (bridge && !tested(bridge) && uniquePatternCount() < MAX_SCALE_PATTERNS){
        route.phase = 'bracketProbe';
        showPattern(bridge, 'Listen and echo');
      } else {
        finishPatterns();
      }
      return;
    }

    advanceAdaptiveQueue();
    return;
  }

  /* A midpoint pattern used only when Too low and Too high bracket each other. */
  if (route.phase === 'bracketProbe'){

    if (comfort === 'Easy' || comfort === 'Okay'){
      beginUpperExploration_(start);
    } else {
      finishPatterns();
    }
    return;
  }

  /* Once a comfortable window exists, explore upward to the first Too high. */
  if (route.phase === 'upperExplore'){

    if (comfort === 'Too high'){
      finishPatterns();
      return;
    }

    advanceAdaptiveQueue();
    return;
  }

  finishPatterns();
}


function advanceAdaptiveQueue(){

  if (uniquePatternCount() >= MAX_SCALE_PATTERNS){
    finishPatterns();
    return;
  }

  while (route.queue.length){
    const next = route.queue.shift();

    if (!tested(next)){
      showPattern(next, 'Listen and echo');
      return;
    }
  }

  finishPatterns();
}


function beginUpperExploration_(fromStart){
  route.phase = 'upperExplore';

  const anchor = fromStart || bestComfortableStartName_() || 'G3';
  const anchorMidi = NOTE_TO_MIDI[anchor];

  route.queue = UPPER_SEQUENCE.filter(function(name){
    return NOTE_TO_MIDI[name] > anchorMidi && !tested(name);
  });

  advanceAdaptiveQueue();
}


function nextLowerStart_(start){
  const index = LOWER_SEQUENCE.indexOf(start);

  if (index >= 0 && index + 1 < LOWER_SEQUENCE.length){
    return LOWER_SEQUENCE[index + 1];
  }

  const startMidi = NOTE_TO_MIDI[start];
  const lower = LOWER_SEQUENCE.filter(function(name){
    return NOTE_TO_MIDI[name] < startMidi && !tested(name);
  });

  return lower.length ? lower[0] : '';
}


function midpointProbe_(lowStart, highStart){
  if (!lowStart || !highStart){
    return '';
  }

  const lowMidi = Math.min(NOTE_TO_MIDI[lowStart], NOTE_TO_MIDI[highStart]);
  const highMidi = Math.max(NOTE_TO_MIDI[lowStart], NOTE_TO_MIDI[highStart]);
  const midpoint = (lowMidi + highMidi) / 2;

  const candidates = Object.keys(NOTE_TO_MIDI)
    .filter(function(name){
      const midi = NOTE_TO_MIDI[name];
      return midi > lowMidi && midi < highMidi && !tested(name);
    })
    .sort(function(a,b){
      return Math.abs(NOTE_TO_MIDI[a] - midpoint) -
             Math.abs(NOTE_TO_MIDI[b] - midpoint);
    });

  return candidates.length ? candidates[0] : '';
}


function finishPatterns(){
  if (comfortablePatternCount() > 0){
    showSustained();
    return;
  }

  state.noComfortablePattern = true;
  state.patternHistory.push({
    exercise:'CONTROLLED_PATTERN_ROUTING',
    comfort:'No comfortable five-note window found'
  });

  showNoComfortablePattern_();
}

/********************************************************************
 * COMFORTABLE SUSTAINED "OO"
 ********************************************************************/

function comfortableStarts_(preferredComfort){
  return state.patternHistory
    .filter(function(item){
      if (!item.start){
        return false;
      }

      if (preferredComfort){
        return item.comfort === preferredComfort;
      }

      return item.comfort === 'Easy' || item.comfort === 'Okay';
    })
    .map(function(item){
      return item.start;
    })
    .filter(function(name, index, array){
      return NOTE_TO_MIDI[name] !== undefined && array.indexOf(name) === index;
    })
    .sort(function(a,b){
      return NOTE_TO_MIDI[a] - NOTE_TO_MIDI[b];
    });
}


function bestComfortableStartName_(){
  let starts = comfortableStarts_('Easy');

  if (!starts.length){
    starts = comfortableStarts_('Okay');
  }

  if (!starts.length){
    return '';
  }

  return starts[
    Math.floor((starts.length - 1) / 2)
  ];
}


function bestComfortableStart(){
  const name = bestComfortableStartName_();

  return name
    ? NOTE_TO_MIDI[name]
    : null;
}
