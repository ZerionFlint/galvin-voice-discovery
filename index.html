<body>

<div class="wrap">

  <div class="brand">
    Galvin Chorus
  </div>

  <h1>
    Private Voice Discovery
  </h1>

  <div class="progress">
    <div id="progressBar"></div>
  </div>

  <main id="app"></main>

</div>



<script>

/********************************************************************
 * CONNECTION
 *
 * Students must start from the authenticated Apps Script launcher.
 * The launcher opens this GitHub microphone page in a new tab and
 * securely relays requests to Apps Script using window.postMessage.
 ********************************************************************/


/********************************************************************
 * MUSICAL SETTINGS
 ********************************************************************/

const TEMPO = 84;

const SCALE_INTERVALS =
  [0,2,4,5,7,5,4,2,0];

const SCALE_SOLFEGE =
  ['Do','Re','Mi','Fa','Sol','Fa','Mi','Re','Do'];

const LEAP_INTERVALS =
  [0,4,7,4,0];

const LEAP_SOLFEGE =
  ['Do','Mi','Sol','Mi','Do'];


/*
 * These are STARTING PITCHES for movable-Do patterns.
 * Students never need to see these note names.
 */
const NOTE_TO_MIDI = {
  'G2':43,
  'A2':45,
  'Bb2':46,

  'C3':48,
  'D3':50,
  'Eb3':51,
  'F3':53,
  'G3':55,
  'A3':57,
  'Bb3':58,

  'C4':60,
  'D4':62,
  'Eb4':63,
  'F4':65,
  'G4':67,
  'A4':69,
  'Bb4':70,

  'C5':72,
  'D5':74,
  'Eb5':75,
  'F5':77
};


/********************************************************************
 * STATE
 ********************************************************************/

let state = {
  studentId:'',
  lastName:'',
  enrollment:null,
  submissionCode:'',
  firstName:'',

  stream:null,
  audioCtx:null,
  analyser:null,
  meterRAF:null,

  patternHistory:[],
  samplesSaved:0,
  noComfortablePattern:false
};

let pending = {};
let reqSeq = 0;

const TOTAL_STEPS = 8;


/********************************************************************
 * GENERAL HELPERS
 ********************************************************************/

function app(){
  return document.getElementById('app');
}


function esc(s){
  return String(s || '')
    .replace(
      /[&<>'"]/g,
      function(c){
        return {
          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          "'":'&#39;',
          '"':'&quot;'
        }[c];
      }
    );
}


function setProgress(n){
  document.getElementById('progressBar')
    .style.width =
    Math.max(
      5,
      Math.round(n / TOTAL_STEPS * 100)
    ) + '%';
}


function sleep(ms){
  return new Promise(
    function(resolve){
      setTimeout(resolve, ms);
    }
  );
}


function disableButtons(){
  document.querySelectorAll('button')
    .forEach(
      function(button){
        button.disabled = true;
      }
    );
}


/********************************************************************
 * APPS SCRIPT BACKEND BRIDGE
 ********************************************************************/

window.addEventListener(
  'message',
  function(event){

    const message = event.data;

    if (
      !message ||
      message.source !== 'galvin-vd-backend' ||
      !message.reqId
    ){
      return;
    }

    const slot =
      pending[message.reqId];

    if (!slot){
      return;
    }

    delete pending[message.reqId];

    if (
      message.response &&
      message.response.ok
    ){
      slot.resolve(
        message.response.data
      );
    } else {
      slot.reject(
        new Error(
          message.response &&
          message.response.error
            ? message.response.error
            : 'Backend error.'
        )
      );
    }
  }
);


function api(action, payload){

  payload = payload || {};

  if (!window.opener || window.opener.closed){
    return Promise.reject(
      new Error(
        'Please start Voice Discovery from the school Voice Discovery link in Google Classroom.'
      )
    );
  }

  return new Promise(
    function(resolve, reject){

      const reqId =
        'r' +
        Date.now() +
        '_' +
        (++reqSeq);

      pending[reqId] = {
        resolve:resolve,
        reject:reject
      };

      window.opener.postMessage(
        {
          source:'galvin-vd-student',
          reqId:reqId,
          request:Object.assign(
            {action:action},
            payload
          )
        },
        '*'
      );

      setTimeout(
        function(){
          if (pending[reqId]){
            delete pending[reqId];
            reject(
              new Error(
                'The school connection did not respond. Make sure the original Galvin Voice Discovery tab is still open.'
              )
            );
          }
        },
        60000
      );
    }
  );
}


/********************************************************************
 * WELCOME / STUDENT IDENTITY
 ********************************************************************/

function showWelcome(){

  setProgress(1);

  app().innerHTML = `

    <div class="card soft">

      <h2>
        This is private — and it is not an audition.
      </h2>

      <p>
        We are finding where your voice feels comfortable
        <b>right now</b>.
        Middle-school voices change, and there is no
        “good” or “bad” result.
      </p>

      <p>
        <b>
          You will not have to listen to your own recording.
        </b>
        You may skip or stop if anything feels uncomfortable.
      </p>

    </div>


    <div class="card">

      <label>
        School email
      </label>

      <div class="emailField">
        <input
          id="studentId"
          inputmode="numeric"
          autocomplete="off"
          placeholder="student number">
        <span class="emailSuffix">@wpsstudent.org</span>
      </div>

      <p class="small">
        Type only the numbers before @wpsstudent.org.
      </p>


      <label>
        Last name
      </label>

      <input
        id="lastName"
        autocomplete="family-name">


      <div class="btnrow">

        <button
          class="primary bigbtn"
          onclick="lookup()">

          Continue

        </button>

      </div>

      <div id="startMsg"></div>

    </div>
  `;
}


async function lookup(){

  const studentId =
    document
      .getElementById('studentId')
      .value
      .trim();

  const lastName =
    document
      .getElementById('lastName')
      .value
      .trim();

  const msg =
    document.getElementById('startMsg');


  if (
    !studentId ||
    !lastName
  ){

    msg.innerHTML =
      '<div class="status warn">' +
      'Enter both fields.' +
      '</div>';

    return;
  }


  msg.innerHTML =
    '<div class="status warn">' +
    'Checking your chorus class…' +
    '</div>';


  try{

    const res =
      await api(
        'lookup',
        {
          studentId:studentId,
          lastName:lastName
        }
      );


    state.studentId =
      studentId;

    state.lastName =
      lastName;


    showEnrollmentChoices(
      res.matches
    );

  } catch(err){

    msg.innerHTML =
      '<div class="status bad">' +
      esc(err.message) +
      '</div>';
  }
}


function showEnrollmentChoices(matches){

  const buttons =
    matches
      .map(
        function(match){

          return `

            <button
              class="secondary"
              style="
                text-align:left;
                width:100%;
                margin:6px 0;
              "
              onclick='chooseEnrollment(${JSON.stringify(match)})'>

              <b>
                ${esc(match.firstName)}
              </b>

              <br>

              <span class="small">
                ${esc(match.label)}
              </span>

            </button>
          `;
        }
      )
      .join('');


  app().innerHTML = `

    <div class="card">

      <h2>
        Is this your chorus class?
      </h2>

      ${buttons}

      <div class="btnrow">

        <button
          class="secondary"
          onclick="showWelcome()">

          Go back

        </button>

      </div>

    </div>
  `;
}


async function chooseEnrollment(match){

  state.enrollment =
    match;


  app().innerHTML =
    '<div class="card">' +
    '<h2>Getting your private voice check ready…</h2>' +
    '</div>';


  try{

    const res =
      await api(
        'start',
        {
          studentId:
            state.studentId,

          lastName:
            state.lastName,

          enrollmentId:
            match.enrollmentId
        }
      );


    state.submissionCode =
      res.submissionCode;

    state.firstName =
      res.firstName || 'Singer';


    showMicSetup(
      state.firstName
    );

  } catch(err){

    app().innerHTML =

      '<div class="card">' +

      '<div class="status bad">' +
      esc(err.message) +
      '</div>' +

      '<div class="btnrow">' +

      '<button class="secondary" onclick="showWelcome()">' +
      'Start over' +
      '</button>' +

      '</div>' +

      '</div>';
  }
}


/********************************************************************
 * MICROPHONE SETUP
 ********************************************************************/

function showMicSetup(firstName){

  setProgress(2);

  app().innerHTML = `

    <div class="card">

      <div class="stepTitle">
        Step 1 — Microphone
      </div>

      <h2>
        Hi ${esc(firstName)}.
        First, let’s make sure your microphone works.
      </h2>

      <p>
        Before you begin:
      </p>

      <ul style="line-height:1.6; padding-left:24px;">
        <li><b>Make sure your microphone is not muted.</b> Some devices have a microphone-mute key or switch.</li>
        <li><b>Turn your device volume up enough to hear the examples clearly.</b> If you are using headphones, use a comfortable volume — not maximum.</li>
        <li>Use a quiet room or quiet space if you can.</li>
      </ul>

      <p>
        Then click <b>Enable microphone</b>.
        If your browser asks for permission, choose <b>Allow</b>.
      </p>

      <p class="muted">
        You will not hear your own recorded voice.
      </p>

      <div class="btnrow">

        <button
          class="primary bigbtn"
          onclick="enableMic()">

          Enable microphone

        </button>

      </div>

      <div id="micArea"></div>

    </div>
  `;
}


async function enableMic(){

  const area =
    document.getElementById('micArea');


  try{

    state.stream =
      await navigator
        .mediaDevices
        .getUserMedia(
          {
            audio:{
              echoCancellation:true,
              noiseSuppression:false,
              autoGainControl:false
            }
          }
        );


    state.audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    // Chrome may create Web Audio in a suspended state after the
    // permission prompt. Try to activate it now; runMicTest() tries
    // again from its own button click before validating signal level.
    try{
      if (state.audioCtx.state === 'suspended'){
        await state.audioCtx.resume();
      }
    } catch(e){}


    const source =
      state.audioCtx
        .createMediaStreamSource(
          state.stream
        );


    state.analyser =
      state.audioCtx
        .createAnalyser();


    state.analyser.fftSize =
      512;


    source.connect(
      state.analyser
    );


    area.innerHTML = `

      <div class="status ok">
        <b>
          Microphone allowed ✓
        </b>
      </div>

      <p>
        Click <b>Test microphone</b>, then say “hello” normally while you watch the meter. If the meter does not move, check that your microphone is not muted.
      </p>

      <div class="meter">
        <div id="meterFill"></div>
      </div>

      <div class="btnrow">

        <button
          class="good"
          onclick="runMicTest()">

          Test microphone

        </button>

      </div>

      <div id="testMsg"></div>
    `;


    runMeter();

  } catch(err){

    area.innerHTML = `

      <div class="status bad">

        <b>
          Microphone is blocked.
        </b>

        <br>

        Click the site-controls icon next to the web address
        → allow <b>Microphone</b>
        → reload this page.

      </div>

      <p class="small">
        If your Chromebook will not let you change it,
        tell Mr. Zini.
        You will get another private option.
      </p>
    `;
  }
}


function runMeter(){

  cancelAnimationFrame(
    state.meterRAF
  );


  const data =
    new Uint8Array(
      state.analyser.fftSize
    );


  function tick(){

    state.analyser
      .getByteTimeDomainData(
        data
      );


    let sum = 0;


    for (const value of data){

      const x =
        (value - 128) / 128;

      sum += x * x;
    }


    const rms =
      Math.sqrt(
        sum / data.length
      );


    const fill =
      document.getElementById(
        'meterFill'
      );


    if (fill){

      fill.style.width =
        Math.min(
          100,
          rms * 550
        ) + '%';
    }


    state.meterRAF =
      requestAnimationFrame(
        tick
      );
  }


  tick();
}


async function runMicTest(){

  const msg =
    document.getElementById(
      'testMsg'
    );

  // This button click is a fresh user gesture, so it is the most
  // reliable place to wake Chrome's Web Audio analyser.
  try{
    if (state.audioCtx && state.audioCtx.state === 'suspended'){
      await state.audioCtx.resume();
    }
  } catch(e){}


  msg.innerHTML =
    '<div class="status warn">' +
    'Say “hello” now…' +
    '</div>';


  try{

    const recording =
      await captureAudio(
        2.5,
        false
      );


    const analyserRunning =
      state.audioCtx &&
      state.audioCtx.state === 'running';

    const signalTooQuiet =
      analyserRunning &&
      recording.maxLevel < 0.0025;

    if (
      recording.blob.size < 800 ||
      signalTooQuiet
    ){

      msg.innerHTML =

        '<div class="status warn">' +

        'I did not hear much sound. ' +
        'Move a little closer and try once more.' +

        '</div>';

      return;
    }


    msg.innerHTML =

      '<div class="status ok">' +

      '<b>Microphone working ✓</b> ' +

      'Your test was captured. ' +
      'It was not saved and you do not need to hear it.' +

      '</div>' +

      '<div class="btnrow">' +

      '<button class="primary bigbtn" onclick="showSpeech()">' +

      'Start Voice Discovery' +

      '</button>' +

      '</div>';

  } catch(err){

    msg.innerHTML =
      '<div class="status bad">' +
      esc(err.message) +
      '</div>';
  }
}


/********************************************************************
 * RECORDING ENGINE
 ********************************************************************/

function recorderMime(){

  const options = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4',
    'audio/ogg;codecs=opus'
  ];


  for (const type of options){

    if (
      window.MediaRecorder &&
      MediaRecorder.isTypeSupported(type)
    ){
      return type;
    }
  }


  return '';
}


function currentLevel(){

  if (!state.analyser){
    return 0;
  }


  const data =
    new Uint8Array(
      state.analyser.fftSize
    );


  state.analyser
    .getByteTimeDomainData(
      data
    );


  let sum = 0;


  for (const value of data){

    const x =
      (value - 128) / 128;

    sum += x * x;
  }


  return Math.sqrt(
    sum / data.length
  );
}


async function captureAudio(
  seconds,
  manual
){

  const mime =
    recorderMime();


  const recorder =
    new MediaRecorder(
      state.stream,
      mime
        ? {mimeType:mime}
        : undefined
    );


  const chunks = [];

  let maxLevel = 0;

  let levelTimer = null;


  recorder.ondataavailable =
    function(event){

      if (
        event.data &&
        event.data.size
      ){
        chunks.push(
          event.data
        );
      }
    };


  const startMs =
    Date.now();


  const stopped =
    new Promise(
      function(resolve, reject){

        recorder.onerror =
          function(event){

            reject(
              event.error ||
              new Error(
                'Recording failed.'
              )
            );
          };


        recorder.onstop =
          function(){

            clearInterval(
              levelTimer
            );


            const blob =
              new Blob(
                chunks,
                {
                  type:
                    recorder.mimeType ||
                    mime ||
                    'audio/webm'
                }
              );


            resolve(
              {
                blob:blob,
                maxLevel:maxLevel,
                durationSec:
                  (Date.now() - startMs) /
                  1000
              }
            );
          };
      }
    );


  recorder.start(
    250
  );


  levelTimer =
    setInterval(
      function(){

        maxLevel =
          Math.max(
            maxLevel,
            currentLevel()
          );

      },
      75
    );


  if (manual){

    state._manualRecorder =
      recorder;

  } else {

    setTimeout(
      function(){

        if (
          recorder.state !==
          'inactive'
        ){
          recorder.stop();
        }

      },
      seconds * 1000
    );
  }


  return stopped;
}


function stopManual(){

  if (
    state._manualRecorder &&
    state._manualRecorder.state !==
    'inactive'
  ){
    state._manualRecorder.stop();
  }
}


async function blobToBase64(blob){

  const buffer =
    await blob.arrayBuffer();


  const bytes =
    new Uint8Array(
      buffer
    );


  let binary = '';

  const chunkSize =
    0x8000;


  for (
    let i = 0;
    i < bytes.length;
    i += chunkSize
  ){

    binary +=
      String
        .fromCharCode
        .apply(
          null,
          bytes.subarray(
            i,
            Math.min(
              i + chunkSize,
              bytes.length
            )
          )
        );
  }


  return btoa(binary);
}

/********************************************************************
 * GENERATED REFERENCE SOUND
 ********************************************************************/

function midiToFreq(midi){

  return (
    440 *
    Math.pow(
      2,
      (midi - 69) / 12
    )
  );
}


function nameForMidi(midi){

  const names = [
    'C',
    'C#',
    'D',
    'Eb',
    'E',
    'F',
    'F#',
    'G',
    'Ab',
    'A',
    'Bb',
    'B'
  ];


  return (
    names[
      (midi % 12 + 12) % 12
    ] +
    (
      Math.floor(midi / 12) - 1
    )
  );
}


/*
 * Gentle synthesized reference tone.
 * No human model voice is used.
 */
function softTone(
  midi,
  start,
  duration
){

  const ctx =
    state.audioCtx;


  const master =
    ctx.createGain();


  master.gain
    .setValueAtTime(
      0.0001,
      start
    );


  master.gain
    .exponentialRampToValueAtTime(
      0.22,
      start + 0.025
    );


  master.gain
    .exponentialRampToValueAtTime(
      0.0001,
      start + duration
    );


  master.connect(
    ctx.destination
  );


  [
    [1,1.00],
    [2,0.18],
    [3,0.06]
  ].forEach(
    function(pair){

      const harmonic =
        pair[0];

      const level =
        pair[1];


      const osc =
        ctx.createOscillator();


      const gain =
        ctx.createGain();


      osc.type =
        'sine';


      osc.frequency
        .setValueAtTime(
          midiToFreq(midi) *
          harmonic,
          start
        );


      gain.gain.value =
        level;


      osc.connect(gain);

      gain.connect(master);


      osc.start(start);

      osc.stop(
        start +
        duration +
        0.03
      );
    }
  );
}


async function playGenerated(
  startMidi,
  intervals,
  solfege
){

  if (
    state.audioCtx.state ===
    'suspended'
  ){
    await state.audioCtx.resume();
  }


  drawContour(
    intervals,
    solfege,
    -1
  );


  const beat =
    60 / TEMPO;


  const ctx =
    state.audioCtx;


  const startTime =
    ctx.currentTime + 0.25;


  let cursor = 0;


  for (
    let i = 0;
    i < intervals.length;
    i++
  ){

    const finalNote =
      i === intervals.length - 1;


    const duration =
      (
        finalNote
          ? beat * 2
          : beat
      ) * 0.90;


    softTone(
      startMidi + intervals[i],
      startTime + cursor,
      duration
    );


    setTimeout(
      function(){

        drawContour(
          intervals,
          solfege,
          i
        );

      },
      (cursor + 0.15) * 1000
    );


    cursor +=
      finalNote
        ? beat * 2
        : beat;
  }


  await sleep(
    (cursor + 0.4) * 1000
  );


  drawContour(
    intervals,
    solfege,
    -1
  );
}


/********************************************************************
 * SOLFEGE CONTOUR
 *
 * Vertical spacing represents semitones:
 *
 * Do -> Re = 2 semitones
 * Re -> Mi = 2 semitones
 * Mi -> Fa = 1 semitone
 * Fa -> Sol = 2 semitones
 *
 * Therefore Mi -> Fa visibly has HALF the vertical spacing
 * of the surrounding whole steps.
 ********************************************************************/

function drawContour(
  intervals,
  solfege,
  active
){

  const holder =
    document.getElementById(
      'contour'
    );


  if (!holder){
    return;
  }


  const width = 760;
  const height = 330;

  const left = 50;
  const right = 50;

  const bottom = 275;

  /*
   * 25 px per semitone:
   * half step = 25 px
   * whole step = 50 px
   */
  const semitonePx = 25;


  const usableWidth =
    width -
    left -
    right;


  const xs =
    intervals.map(
      function(_, i){

        return (
          left +
          i *
          (
            usableWidth /
            (intervals.length - 1)
          )
        );
      }
    );


  const ys =
    intervals.map(
      function(interval){

        return (
          bottom -
          interval *
          semitonePx
        );
      }
    );


  const points =
    xs.map(
      function(x, i){

        return (
          x +
          ',' +
          ys[i]
        );
      }
    ).join(' ');


  let svg =

    '<svg ' +
    'viewBox="0 0 ' +
    width +
    ' ' +
    height +
    '" ' +
    'aria-label="Solfege pitch contour">' +

    '<polyline ' +
    'class="contourLine" ' +
    'points="' +
    points +
    '">' +
    '</polyline>';


  xs.forEach(
    function(x, i){

      svg +=

        '<circle ' +
        'class="noteCircle ' +
        (
          i === active
            ? 'active'
            : ''
        ) +
        '" ' +
        'cx="' +
        x +
        '" ' +
        'cy="' +
        ys[i] +
        '" ' +
        'r="25">' +
        '</circle>' +

        '<text ' +
        'class="solfegeText" ' +
        'x="' +
        x +
        '" ' +
        'y="' +
        ys[i] +
        '">' +
        solfege[i] +
        '</text>';
    }
  );


  svg +=
    '</svg>';


  holder.innerHTML =
    svg;
}

    .some(
      function(item){

          item.start ===
          startName

}


/********************************************************************
 * ADAPTIVE ROUTING — vNEXT
 *
 * Goals:
 * - Start in a safer middle/lower neighborhood at G3 -> D4.
 * - Never let a difficult pattern end the assessment.
 * - Student reports Easy / Okay / Too high / Too low.
 * - Find at least one comfortable five-note window when possible.
 * - Stop after a useful neighborhood/boundary picture, max 7 patterns.
 ********************************************************************/

function uniquePatternCount(){
  const seen = {};

  state.patternHistory.forEach(function(item){
    if (item.start){
      seen[item.start] = true;
    }
  });

  return Object.keys(seen).length;
}


function comfortablePatternCount(){
  return state.patternHistory.filter(function(item){
    return item.comfort === 'Easy' || item.comfort === 'Okay';
  }).length;
}


function nextPattern(
  start,
  comfort
){

  if (comfort === 'Too high'){
    route.lastTooHighStart = start;
  }

  if (comfort === 'Too low'){
    route.lastTooLowStart = start;
  }

  if (uniquePatternCount() >= MAX_SCALE_PATTERNS){
    finishPatterns();
    return;
  }

  /* First probe: G3 -> D4 */
  if (route.phase === 'start' && start === 'G3'){

    if (comfort === 'Too high'){
      route.phase = 'seekLowerComfort';
      route.queue = ['F3','D3','Bb2','A2','G2'];
      advanceAdaptiveQueue();
      return;
    }

    if (comfort === 'Too low'){
      route.phase = 'seekUpperComfort';
      route.queue = ['A3','Bb3','C4','D4','F4','G4','A4','Bb4','C5','D5'];
      advanceAdaptiveQueue();
      return;
    }

    // G3 was comfortable: check a little lower before exploring upward.
    route.phase = 'lowerProbe';
    route.queue = ['F3','D3'];
    advanceAdaptiveQueue();
    return;
  }

  /* We started too high and are moving down until something works. */
  if (route.phase === 'seekLowerComfort'){

    if (comfort === 'Easy' || comfort === 'Okay'){
      const lower = nextLowerStart_(start);

      if (lower && !tested(lower) && uniquePatternCount() < MAX_SCALE_PATTERNS){
        route.phase = 'finalLowerProbe';
        showPattern(lower, 'Listen and echo');
      } else {
        finishPatterns();
      }
      return;
    }

    if (comfort === 'Too low'){
      const bridge = midpointProbe_(route.lastTooHighStart, start);

      if (bridge && !tested(bridge) && uniquePatternCount() < MAX_SCALE_PATTERNS){
        route.phase = 'bracketProbe';
        showPattern(bridge, 'Listen and echo');
      } else {
        finishPatterns();
      }
      return;
    }

    advanceAdaptiveQueue();
    return;
  }

  /* One lower check after a comfortable lower/changing-voice window. */
  if (route.phase === 'finalLowerProbe'){
    finishPatterns();
    return;
  }

  /* G3 worked; check F3/D3, then explore upward. */
  if (route.phase === 'lowerProbe'){

    if (comfort === 'Easy' || comfort === 'Okay'){
      if (route.queue.length && uniquePatternCount() < MAX_SCALE_PATTERNS){
        advanceAdaptiveQueue();
      } else {
        beginUpperExploration_();
      }
      return;
    }

    // Once the lower probe is too low (or unexpectedly too high),
    // the comfortable G3 evidence is enough to begin moving upward.
    beginUpperExploration_();
    return;
  }

  /* G3 was too low; move upward until the first comfortable window. */
  if (route.phase === 'seekUpperComfort'){

    if (comfort === 'Easy' || comfort === 'Okay'){
      beginUpperExploration_(start);
      return;
    }

    if (comfort === 'Too high'){
      const bridge = midpointProbe_(route.lastTooLowStart, start);

      if (bridge && !tested(bridge) && uniquePatternCount() < MAX_SCALE_PATTERNS){
        route.phase = 'bracketProbe';
        showPattern(bridge, 'Listen and echo');
      } else {
        finishPatterns();
      }
      return;
    }

    advanceAdaptiveQueue();
    return;
  }

  /* A midpoint pattern used only when Too low and Too high bracket each other. */
  if (route.phase === 'bracketProbe'){

    if (comfort === 'Easy' || comfort === 'Okay'){
      beginUpperExploration_(start);
    } else {
      finishPatterns();
    }
    return;
  }

  /* Once a comfortable window exists, explore upward to the first Too high. */
  if (route.phase === 'upperExplore'){

    if (comfort === 'Too high'){
      finishPatterns();
      return;
    }

    advanceAdaptiveQueue();
    return;
  }

  finishPatterns();
}


function advanceAdaptiveQueue(){

  if (uniquePatternCount() >= MAX_SCALE_PATTERNS){
    finishPatterns();
    return;
  }

  while (route.queue.length){
    const next = route.queue.shift();

    if (!tested(next)){
      showPattern(next, 'Listen and echo');
      return;
    }
  }

  finishPatterns();
}


function beginUpperExploration_(fromStart){
  route.phase = 'upperExplore';

  const anchor = fromStart || bestComfortableStartName_() || 'G3';
  const anchorMidi = NOTE_TO_MIDI[anchor];

  route.queue = UPPER_SEQUENCE.filter(function(name){
    return NOTE_TO_MIDI[name] > anchorMidi && !tested(name);
  });

  advanceAdaptiveQueue();
}


function nextLowerStart_(start){
  const index = LOWER_SEQUENCE.indexOf(start);

  if (index >= 0 && index + 1 < LOWER_SEQUENCE.length){
    return LOWER_SEQUENCE[index + 1];
  }

  const startMidi = NOTE_TO_MIDI[start];
  const lower = LOWER_SEQUENCE.filter(function(name){
    return NOTE_TO_MIDI[name] < startMidi && !tested(name);
  });

  return lower.length ? lower[0] : '';
}


function midpointProbe_(lowStart, highStart){
  if (!lowStart || !highStart){
    return '';
  }

  const lowMidi = Math.min(NOTE_TO_MIDI[lowStart], NOTE_TO_MIDI[highStart]);
  const highMidi = Math.max(NOTE_TO_MIDI[lowStart], NOTE_TO_MIDI[highStart]);
  const midpoint = (lowMidi + highMidi) / 2;

  const candidates = Object.keys(NOTE_TO_MIDI)
    .filter(function(name){
      const midi = NOTE_TO_MIDI[name];
      return midi > lowMidi && midi < highMidi && !tested(name);
    })
    .sort(function(a,b){
      return Math.abs(NOTE_TO_MIDI[a] - midpoint) -
             Math.abs(NOTE_TO_MIDI[b] - midpoint);
    });

  return candidates.length ? candidates[0] : '';
}


function finishPatterns(){
  if (comfortablePatternCount() > 0){
    showSustained();
    return;
  }

  state.noComfortablePattern = true;
  state.patternHistory.push({
    exercise:'CONTROLLED_PATTERN_ROUTING',
    comfort:'No comfortable five-note window found'
  });

  showNoComfortablePattern_();
}


function showNoComfortablePattern_(){
  setProgress(6);

  app().innerHTML = `
    <div class="card">
      <div class="stepTitle">Voice Discovery</div>
      <h2>Thanks — that gave us useful information.</h2>
      <p>
        The app did not find one five-note pattern that felt comfortable enough
        to use for the final pitch exercises. That is okay and is useful for your teacher to know.
      </p>
      <p class="muted">
        You do not need to force your voice higher or lower.
      </p>
      <div class="btnrow">
        <button class="primary bigbtn" onclick="showFinish()">Continue</button>
      </div>
    </div>
  `;
}


/********************************************************************
 * COMFORTABLE SUSTAINED "OO"
 ********************************************************************/

function comfortableStarts_(preferredComfort){
  return state.patternHistory
    .filter(function(item){
      if (!item.start){
        return false;
      }

      if (preferredComfort){
        return item.comfort === preferredComfort;
      }

      return item.comfort === 'Easy' || item.comfort === 'Okay';
    })
    .map(function(item){
      return item.start;
    })
    .filter(function(name, index, array){
      return NOTE_TO_MIDI[name] !== undefined && array.indexOf(name) === index;
    })
    .sort(function(a,b){
      return NOTE_TO_MIDI[a] - NOTE_TO_MIDI[b];
    });
}


function bestComfortableStartName_(){
  let starts = comfortableStarts_('Easy');

  if (!starts.length){
    starts = comfortableStarts_('Okay');
  }

  if (!starts.length){
    return '';
  }

  return starts[
    Math.floor((starts.length - 1) / 2)
  ];
}


function bestComfortableStart(){
  const name = bestComfortableStartName_();

  return name
    ? NOTE_TO_MIDI[name]
    : null;
}


function showSustained(){

  setProgress(6);


  const comfortableTonic =
    bestComfortableStart();

  if (comfortableTonic === null){
    showNoComfortablePattern_();
    return;
  }


  /*
   * Use Mi of a successful five-note pattern.
   * That keeps the sustained note away from
   * both the bottom and top of that pattern.
   */
  state._sustainMidi =
    comfortableTonic + 4;


  app().innerHTML = `

    <div class="card">

      <div class="stepTitle">
        Step 5 — Comfortable sustained sound
      </div>

      <h2>
        One easy “oo”
      </h2>

      <p>
        The app chose a pitch from the middle
        of a pattern that felt comfortable.
      </p>

      <p>
        For this exercise,
        think of this single pitch as
        <b>Do</b>.
      </p>

      <div class="btnrow">

        <button
          class="primary bigbtn"
          onclick="listenSustain()">

          ▶ Hear your Do

        </button>

      </div>

      <div id="sustainAction"></div>

    </div>
  `;
}


async function listenSustain(){

  await state.audioCtx.resume();


  const ctx =
    state.audioCtx;


  const now =
    ctx.currentTime + 0.15;


  softTone(
    state._sustainMidi,
    now,
    1.25
  );


  await sleep(
    1550
  );


  document
    .getElementById(
      'sustainAction'
    )
    .innerHTML = `

      <p>
        Now hold <b>“oo”</b>
        comfortably for about 4 seconds.
        Do not push. If singing ever hurts, stop singing and tell Mr. Zini.
      </p>

      <div class="btnrow">

        <button
          class="good"
          onclick="recordSustain()">

          I’m ready

        </button>

      </div>
    `;
}


async function recordSustain(){

  disableButtons();

  await countdown();


  const area =
    document.getElementById(
      'sustainAction'
    );


  area.innerHTML =

    '<div class="recording">' +

    '<span class="dot"></span>' +

    'Hold “oo”…' +

    '</div>';


  try{

    const recording =
      await captureAudio(
        5,
        false
      );


    const pitchName =
      nameForMidi(
        state._sustainMidi
      );


    await uploadRecording(
      'SUSTAIN_' +
      pitchName.replace('#','SHARP'),
      'sustained_vowel',
      recording,
      {
        expectedPitches:
          pitchName,

        expectedMidi:
          String(
            state._sustainMidi
          ),

        solfege:
          'Do',

        tonic:
          pitchName
      }
    );


    area.innerHTML =

      '<div class="status ok">' +

      'Captured ✓' +

      '</div>' +

      '<div class="btnrow">' +

      '<button class="primary" onclick="showLeap()">' +

      'Continue' +

      '</button>' +

      '</div>';

  } catch(err){

    area.innerHTML =
      '<div class="status bad">' +
      esc(err.message) +
      '</div>';
  }
}


/********************************************************************
 * LEAP / INTERVAL CHECK
 ********************************************************************/

function showLeap(){

  setProgress(7);


  state._leapTonic =
    bestComfortableStart();

  if (state._leapTonic === null){
    showFinish();
    return;
  }


  app().innerHTML = `

    <div class="card">

      <div class="stepTitle">
        Step 6 — One leap pattern
      </div>

      <h2>
        Do – Mi – Sol – Mi – Do
      </h2>

      <p>
        This checks a different kind of
        pitch matching than the stepwise pattern.
        The app chose a starting pitch from a pattern that felt comfortable.
      </p>

      <div
        id="contour"
        class="contourWrap">
      </div>

      <div class="btnrow">

        <button
          class="primary bigbtn"
          onclick="listenLeap()">

          ▶ Listen

        </button>

      </div>

      <div id="leapAction"></div>

    </div>
  `;


  drawContour(
    LEAP_INTERVALS,
    LEAP_SOLFEGE,
    -1
  );
}


async function listenLeap(){

  await playGenerated(
    state._leapTonic,
    LEAP_INTERVALS,
    LEAP_SOLFEGE
  );


  document
    .getElementById(
      'leapAction'
    )
    .innerHTML = `

      <p>
        Your turn:
        sing
        <b>
          Do – Mi – Sol – Mi – Do
        </b>
        on
        <b>“loo.”</b>
      </p>

      <div class="btnrow">

        <button
          class="good"
          onclick="recordLeap()">

          I’m ready

        </button>

      </div>
    `;
}


async function recordLeap(){

  disableButtons();

  await countdown();


  const area =
    document.getElementById(
      'leapAction'
    );


  area.innerHTML =

    '<div class="recording">' +

    '<span class="dot"></span>' +

    'Recording…' +

    '</div>';


  try{

    const beat =
      60 / TEMPO;


    const recording =
      await captureAudio(
        (5 * beat) + 2,
        false
      );


    const midis =
      LEAP_INTERVALS.map(
        function(interval){

          return (
            state._leapTonic +
            interval
          );
        }
      );


    await uploadRecording(
      'LEAP_' +
      nameForMidi(
        state._leapTonic
      ).replace('#','SHARP'),

      'leap_echo',

      recording,

      {
        expectedPitches:
          midis
            .map(nameForMidi)
            .join(' '),

        expectedMidi:
          midis.join(','),

        solfege:
          LEAP_SOLFEGE
            .join('–'),

        tonic:
          nameForMidi(
            state._leapTonic
          ),

        tempoBpm:
          TEMPO
      }
    );


    area.innerHTML =

      '<div class="status ok">' +

      'Captured ✓' +

      '</div>' +

      '<div class="btnrow">' +

      '<button class="primary" onclick="showFinish()">' +

      'Continue' +

      '</button>' +

      '</div>';

  } catch(err){

    area.innerHTML =
      '<div class="status bad">' +
      esc(err.message) +
      '</div>';
  }
}


/********************************************************************
 * FINAL COMFORT + SUBMISSION
 ********************************************************************/

function showFinish(){

  setProgress(8);


  app().innerHTML = `

    <div class="card">

      <div class="stepTitle">
        Final step
      </div>

      <h2>
        How did the whole voice check feel?
      </h2>

      <div class="comforts">

        <button
          onclick="finalize('Comfortable')">
          Comfortable
        </button>

        <button
          onclick="finalize('Mostly okay')">
          Mostly okay
        </button>

        <button
          onclick="finalize('Nervous but manageable')">
          Nervous but manageable
        </button>

        <button
          onclick="finalize('Uncomfortable')">
          Uncomfortable
        </button>

      </div>

      <div id="finishMsg"></div>

    </div>
  `;
}


async function finalize(
  overallComfort
){

  disableButtons();


  const msg =
    document.getElementById(
      'finishMsg'
    );


  msg.innerHTML =

    '<div class="status warn">' +

    'Finishing your private submission…' +

    '</div>';


  try{

    await api(
      'finalize',
      {
        submissionCode:
          state.submissionCode,

        overallComfort:
          overallComfort,

        patternSummary:
          state.patternHistory
      }
    );


    if (state.stream){

      state.stream
        .getTracks()
        .forEach(
          function(track){

            track.stop();
          }
        );
    }


    cancelAnimationFrame(
      state.meterRAF
    );


    app().innerHTML = `

      <div class="card">

        <h2>
          You’re finished ✓
        </h2>

        <p>
          Thank you.
          Your recordings were captured privately.
        </p>

        <p>
          <b>
            You did not have to listen to your own recorded voice.
          </b>
        </p>

        <p class="muted">
          Your teacher will use the recordings
          to find a comfortable chorus part.
          This is not a grade or audition score.
        </p>

      </div>
    `;

  } catch(err){

    msg.innerHTML =
      '<div class="status bad">' +
      esc(err.message) +
      '</div>';
  }
}
